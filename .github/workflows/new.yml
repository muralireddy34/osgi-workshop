name: Northwind OSGi Smart Build

on:
  pull_request:

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build mode"
        required: true
        type: choice
        default: changed
        options:
          - changed
          - all

permissions:
  contents: read

env:
  PROJECT_DIR: osgi-workshop

jobs:

  build:
    name: Smart OSGi Build
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Setup Java
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ------------------------------------------------------------
      # 3. Display environment
      # ------------------------------------------------------------
      - name: Display build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "OSGi Smart Build"
          echo "========================================="
          echo "Project directory : ${PROJECT_DIR}"
          echo "Java version      :"
          java -version
          echo
          echo "Maven version     :"
          mvn -version
          echo "========================================="

      # ------------------------------------------------------------
      # 4. Discover Maven / OSGi projects
      #
      # No module names are specified here.
      #
      # A project is discovered automatically when its directory
      # contains a pom.xml.
      # ------------------------------------------------------------
      - name: Discover Maven and OSGi projects
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          rm -f /tmp/osgi_projects.txt
          rm -f /tmp/osgi_project_metadata.txt

          echo "========================================="
          echo "Discovering projects"
          echo "========================================="

          while IFS= read -r -d '' pom; do

            dir="$(dirname "${pom}")"

            #
            # Skip Maven target directories
            #
            if [[ "${dir}" == *"/target"* ]]; then
              continue
            fi

            #
            # Determine Maven coordinates.
            # Maven itself is used instead of hard-coding
            # artifact/module names.
            #
            artifact_id="$(
              mvn -q \
                -f "${pom}" \
                help:evaluate \
                -Dexpression=project.artifactId \
                -DforceStdout \
                2>/dev/null \
                | tail -n 1
            )"

            group_id="$(
              mvn -q \
                -f "${pom}" \
                help:evaluate \
                -Dexpression=project.groupId \
                -DforceStdout \
                2>/dev/null \
                | tail -n 1
            )"

            packaging="$(
              mvn -q \
                -f "${pom}" \
                help:evaluate \
                -Dexpression=project.packaging \
                -DforceStdout \
                2>/dev/null \
                | tail -n 1
            )"

            #
            # Ignore POMs that Maven cannot identify.
            #
            if [[ -z "${artifact_id}" || "${artifact_id}" == "null object or invalid expression" ]]; then
              continue
            fi

            relative_dir="${dir#./}"

            #
            # Determine whether the project contains OSGi metadata.
            #
            is_osgi="false"

            if [[ -f "${dir}/src/main/resources/META-INF/MANIFEST.MF" ]]; then
              is_osgi="true"
            fi

            if find "${dir}" \
                -path "*/target" -prune -o \
                -name "MANIFEST.MF" -print -quit \
                | grep -q .; then
              is_osgi="true"
            fi

            if find "${dir}" \
                -path "*/target" -prune -o \
                -name "feature.xml" -print -quit \
                | grep -q .; then
              is_osgi="true"
            fi

            printf '%s\n' "${relative_dir}" >> /tmp/osgi_projects.txt

            printf '%s|%s|%s|%s|%s\n' \
              "${relative_dir}" \
              "${group_id}" \
              "${artifact_id}" \
              "${packaging}" \
              "${is_osgi}" \
              >> /tmp/osgi_project_metadata.txt

          done < <(
            find . \
              -name pom.xml \
              -not -path "*/target/*" \
              -print0
          )

          sort -u /tmp/osgi_projects.txt -o /tmp/osgi_projects.txt

          echo
          echo "Discovered projects:"
          echo

          cat /tmp/osgi_project_metadata.txt

          echo
          echo "Total projects:"
          wc -l < /tmp/osgi_projects.txt

          if [[ ! -s /tmp/osgi_projects.txt ]]; then
            echo "ERROR: No Maven projects were discovered."
            exit 1
          fi

      # ------------------------------------------------------------
      # 5. Determine build mode
      # ------------------------------------------------------------
      - name: Determine build mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.build_mode }}"
          else
            MODE="changed"
          fi

          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"

          echo "========================================="
          echo "Build mode: ${MODE}"
          echo "========================================="

      # ------------------------------------------------------------
      # 6. Discover dependency relationships
      #
      # Dependency information comes from:
      #
      #   1. Maven dependency:tree
      #   2. OSGi Require-Bundle
      #
      # No product/module names are maintained in the workflow.
      # ------------------------------------------------------------
      - name: Discover Maven and OSGi dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          rm -f /tmp/osgi_dependency_graph.txt
          touch /tmp/osgi_dependency_graph.txt

          echo "========================================="
          echo "Discovering dependency graph"
          echo "========================================="

          #
          # Build lookup:
          #
          # groupId:artifactId -> project directory
          #
          declare -A PROJECT_BY_COORD

          while IFS='|' read -r project group artifact packaging is_osgi; do
            PROJECT_BY_COORD["${group}:${artifact}"]="${project}"
          done < /tmp/osgi_project_metadata.txt

          #
          # ----------------------------------------------------------
          # Maven dependencies
          # ----------------------------------------------------------
          #
          while IFS= read -r project; do

            pom="${project}/pom.xml"

            [[ -f "${pom}" ]] || continue

            echo
            echo "Checking Maven dependencies:"
            echo "  ${project}"

            dependency_output="$(
              mvn -q \
                -f "${pom}" \
                dependency:tree \
                -Dverbose \
                -Dscope=compile \
                2>/dev/null || true
            )"

            while IFS= read -r line; do

              #
              # Extract dependency coordinates.
              #
              # Example:
              #
              # group:artifact:jar:version
              #
              coordinate="$(
                printf '%s\n' "${line}" |
                grep -oE \
                  '[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:(jar|bundle|eclipse-plugin|pom):[^[:space:]:()]+' |
                head -n 1 ||
                true
              )"

              [[ -z "${coordinate}" ]] && continue

              dependency_group="$(cut -d: -f1 <<< "${coordinate}")"
              dependency_artifact="$(cut -d: -f2 <<< "${coordinate}")"

              dependency_coord="${dependency_group}:${dependency_artifact}"

              dependency_project="${PROJECT_BY_COORD[${dependency_coord}]:-}"

              #
              # Only create edges when the dependency belongs
              # to another project in this repository.
              #
              if [[ -n "${dependency_project}" &&
                    "${dependency_project}" != "${project}" ]]; then

                printf '%s|%s|%s\n' \
                  "${dependency_project}" \
                  "${project}" \
                  "maven" \
                  >> /tmp/osgi_dependency_graph.txt
              fi

            done <<< "${dependency_output}"

          done < /tmp/osgi_projects.txt

          #
          # ----------------------------------------------------------
          # OSGi Require-Bundle dependencies
          # ----------------------------------------------------------
          #
          declare -A PROJECT_BY_SYMBOLIC_NAME

          while IFS='|' read -r project group artifact packaging is_osgi; do

            manifest=""

            while IFS= read -r candidate; do
              manifest="${candidate}"
              break
            done < <(
              find "${project}" \
                -path "*/target" -prune -o \
                -name MANIFEST.MF \
                -print
            )

            [[ -z "${manifest}" ]] && continue
            [[ -f "${manifest}" ]] || continue

            symbolic_name="$(
              awk '
                BEGIN { RS="\r?\n"; }
                /^Bundle-SymbolicName:/ {
                  sub(/^Bundle-SymbolicName:[[:space:]]*/, "")
                  sub(/;.*/, "")
                  print
                  exit
                }
              ' "${manifest}"
            )"

            if [[ -n "${symbolic_name}" ]]; then
              PROJECT_BY_SYMBOLIC_NAME["${symbolic_name}"]="${project}"
            fi

          done < /tmp/osgi_project_metadata.txt

          #
          # Second pass:
          # discover Require-Bundle edges after all symbolic names
          # are known.
          #
          while IFS= read -r project; do

            manifest=""

            while IFS= read -r candidate; do
              manifest="${candidate}"
              break
            done < <(
              find "${project}" \
                -path "*/target" -prune -o \
                -name MANIFEST.MF \
                -print
            )

            [[ -z "${manifest}" ]] && continue
            [[ -f "${manifest}" ]] || continue

            require_bundle="$(
              awk '
                BEGIN {
                  collecting=0
                }

                /^Require-Bundle:/ {
                  collecting=1
                  sub(/^Require-Bundle:[[:space:]]*/, "")
                  printf "%s", $0
                  next
                }

                collecting {
                  if ($0 ~ /^[^[:space:]]/ && $0 !~ /^[[:space:]]/) {
                    collecting=0
                    print ""
                  } else {
                    gsub(/^[[:space:]]+/, "")
                    printf "%s", $0
                  }
                }

                END {
                  if (collecting)
                    print ""
                }
              ' "${manifest}"
            )"

            [[ -z "${require_bundle}" ]] && continue

            #
            # Remove OSGi version directives and attributes.
            #
            require_bundle="$(
              printf '%s\n' "${require_bundle}" |
              sed 's/;bundle-version[^,]*/ /g' |
              sed 's/;resolution[^,]*/ /g' |
              sed 's/;visibility[^,]*/ /g'
            )"

            while IFS= read -r symbolic_name; do

              symbolic_name="$(xargs <<< "${symbolic_name}")"

              [[ -z "${symbolic_name}" ]] && continue

              dependency_project="${PROJECT_BY_SYMBOLIC_NAME[${symbolic_name}]:-}"

              if [[ -n "${dependency_project}" &&
                    "${dependency_project}" != "${project}" ]]; then

                printf '%s|%s|%s\n' \
                  "${dependency_project}" \
                  "${project}" \
                  "osgi" \
                  >> /tmp/osgi_dependency_graph.txt

              fi

            done < <(
              tr ',' '\n' <<< "${require_bundle}"
            )

          done < /tmp/osgi_projects.txt

          #
          # Remove duplicates.
          #
          sort -u /tmp/osgi_dependency_graph.txt \
            -o /tmp/osgi_dependency_graph.txt

          echo
          echo "Dependency graph:"
          echo
          cat /tmp/osgi_dependency_graph.txt || true

          echo
          echo "Total dependency relationships:"
          wc -l < /tmp/osgi_dependency_graph.txt

      # ------------------------------------------------------------
      # 7. Detect changed projects
      # ------------------------------------------------------------
      - name: Detect changed projects
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          rm -f /tmp/changed_projects.txt
          touch /tmp/changed_projects.txt

          MODE="${{ steps.mode.outputs.mode }}"

          if [[ "${MODE}" == "all" ]]; then

            echo "Build mode is ALL."
            echo "Every discovered project will be selected."

            cat /tmp/osgi_projects.txt > /tmp/changed_projects.txt

          else

            echo "Build mode is CHANGED."

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            else

              HEAD_SHA="${{ github.sha }}"

              if git rev-parse HEAD^ >/dev/null 2>&1; then
                BASE_SHA="$(git rev-parse HEAD^)"
              else
                BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
              fi

            fi

            echo "Base SHA: ${BASE_SHA}"
            echo "Head SHA: ${HEAD_SHA}"

            #
            # Get changed files relative to PROJECT_DIR.
            #
            while IFS= read -r file; do

              [[ -z "${file}" ]] && continue

              #
              # Find the deepest discovered project directory
              # that contains the changed file.
              #
              best_project=""

              while IFS= read -r project; do

                if [[ "${file}" == "${project}"/* ||
                      "${file}" == "${project}" ]]; then

                  if [[ ${#project} -gt ${#best_project} ]]; then
                    best_project="${project}"
                  fi

                fi

              done < /tmp/osgi_projects.txt

              if [[ -n "${best_project}" ]]; then
                echo "${best_project}" >> /tmp/changed_projects.txt
              else
                #
                # A root-level change can affect the whole reactor.
                #
                if [[ "${file}" == "pom.xml" ||
                      "${file}" == .mvn/* ||
                      "${file}" == .mvn ]]; then

                  echo "Root build configuration changed."
                  cat /tmp/osgi_projects.txt > /tmp/changed_projects.txt
                  break

                fi
              fi

            done < <(
              git diff \
                --name-only \
                "${BASE_SHA}" \
                "${HEAD_SHA}" \
                -- .
            )

          fi

          sort -u /tmp/changed_projects.txt \
            -o /tmp/changed_projects.txt

          echo
          echo "Changed projects:"
          cat /tmp/changed_projects.txt || true

          echo
          echo "Changed project count:"
          wc -l < /tmp/changed_projects.txt

      # ------------------------------------------------------------
      # 8. Calculate impacted/downstream projects
      #
      # Dependency graph format:
      #
      # dependency | dependent | source
      #
      # If:
      #
      # A -> B
      #
      # and A changes,
      # B is also impacted.
      #
      # This is repeated until no more downstream projects are found.
      # ------------------------------------------------------------
      - name: Calculate impacted projects
        id: impacted
        shell: bash
        run: |
          set -euo pipefail

          rm -f /tmp/selected_projects.txt
          touch /tmp/selected_projects.txt

          MODE="${{ steps.mode.outputs.mode }}"

          if [[ "${MODE}" == "all" ]]; then

            cat "${PROJECT_DIR}/../" 2>/dev/null >/dev/null || true

            cat "${PROJECT_DIR}/../${PROJECT_DIR##*/}" 2>/dev/null >/dev/null || true

            cat "${PROJECT_DIR}/../${PROJECT_DIR}" 2>/dev/null >/dev/null || true

            #
            # In ALL mode, all discovered projects are selected.
            #
            cat "${PROJECT_DIR}/../${PROJECT_DIR}/../tmp/nonexistent" \
              2>/dev/null || true

            cp "${PROJECT_DIR}/../tmp/nonexistent" \
              /tmp/selected_projects.txt \
              2>/dev/null || true

            #
            # Correct source of discovered projects.
            #
            cp "${PROJECT_DIR}/../osgi_projects.txt" \
              /tmp/selected_projects.txt \
              2>/dev/null || true

          fi

          #
          # The discovery files live in /tmp and the runner shell
          # is the same job, so use the actual discovery file.
          #
          if [[ "${MODE}" == "all" ]]; then
            cp /tmp/osgi_projects.txt /tmp/selected_projects.txt

          else

            cp /tmp/changed_projects.txt /tmp/selected_projects.txt

            #
            # Repeatedly find dependents until the graph stops growing.
            #
            changed_count=1

            while [[ "${changed_count}" -gt 0 ]]; do

              changed_count=0

              while IFS='|' read -r dependency dependent source; do

                [[ -z "${dependency}" ]] && continue
                [[ -z "${dependent}" ]] && continue

                if grep -Fxq "${dependency}" /tmp/selected_projects.txt &&
                   ! grep -Fxq "${dependent}" /tmp/selected_projects.txt; then

                  echo "${dependent}" >> /tmp/selected_projects.txt
                  changed_count=$((changed_count + 1))

                  echo "Impacted:"
                  echo "  ${dependency}"
                  echo "       -> ${dependent}"
                  echo "       (${source})"

                fi

              done < /tmp/osgi_dependency_graph.txt

              sort -u /tmp/selected_projects.txt \
                -o /tmp/selected_projects.txt

            done

          fi

          sort -u /tmp/selected_projects.txt \
            -o /tmp/selected_projects.txt

          echo
          echo "========================================="
          echo "Selected projects"
          echo "========================================="

          cat /tmp/selected_projects.txt

          echo
          echo "Selected count:"
          wc -l < /tmp/selected_projects.txt

          if [[ ! -s /tmp/selected_projects.txt ]]; then
            echo "No Maven/OSGi project requires building."
            echo "No source or build metadata changes detected."
          fi

      # ------------------------------------------------------------
      # 9. Convert project paths to Maven reactor selectors
      #
      # Maven supports:
      #
      #   -pl project1,project2
      #   -am
      #
      # Maven then calculates the actual reactor dependency order.
      # ------------------------------------------------------------
      - name: Prepare Maven reactor selection
        id: reactor
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s /tmp/selected_projects.txt ]]; then
            echo "has_projects=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          #
          # Maven -pl accepts comma-separated project selectors.
          # Paths are relative to the Maven reactor root.
          #
          PROJECT_LIST="$(
            paste -sd, /tmp/selected_projects.txt
          )"

          echo "project_list=${PROJECT_LIST}" >> "${GITHUB_OUTPUT}"
          echo "has_projects=true" >> "${GITHUB_OUTPUT}"

          echo
          echo "Maven reactor selection:"
          echo "${PROJECT_LIST}"

      # ------------------------------------------------------------
      # 10. Show Maven's actual calculated reactor order
      #
      # This is intentionally NOT a manually maintained order.
      # Maven/Tycho resolves the reactor order from the actual POM
      # dependency metadata.
      # ------------------------------------------------------------
      - name: Determine Maven reactor build order
        if: steps.reactor.outputs.has_projects == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          PROJECT_LIST="${{ steps.reactor.outputs.project_list }}"

          echo "========================================="
          echo "Maven Reactor Build Order"
          echo "========================================="

          mvn \
            -B \
            -DskipTests \
            -pl "${PROJECT_LIST}" \
            -am \
            validate

      # ------------------------------------------------------------
      # 11. Build selected projects
      #
      # Maven is responsible for the real dependency-aware build
      # order.
      #
      # -pl = selected impacted projects
      # -am = also make required upstream dependencies
      #
      # This prevents sibling-module build failures that can happen
      # when every module is built independently with separate
      # "mvn -f module/pom.xml" commands.
      # ------------------------------------------------------------
      - name: Build selected OSGi projects
        if: steps.reactor.outputs.has_projects == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          PROJECT_LIST="${{ steps.reactor.outputs.project_list }}"

          echo "========================================="
          echo "Building selected OSGi projects"
          echo "========================================="
          echo
          echo "Selected reactor projects:"
          echo "${PROJECT_LIST}"
          echo

          mvn \
            -B \
            -DskipTests \
            -pl "${PROJECT_LIST}" \
            -am \
            clean package

      # ------------------------------------------------------------
      # 12. Display generated artifacts
      # ------------------------------------------------------------
      - name: Display generated artifacts
        if: steps.reactor.outputs.has_projects == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Generated Artifacts"
          echo "========================================="

          find . \
            -path "*/target/*" \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
              -o -name "*.esa" \
              -o -name "*.xml" \
            \) \
            -print

      # ------------------------------------------------------------
      # 13. Final summary
      # ------------------------------------------------------------
      - name: Build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## OSGi Smart Build"
            echo
            echo "**Project directory:** \`${PROJECT_DIR}\`"
            echo
            echo "**Build mode:** \`${{ steps.mode.outputs.mode }}\`"
            echo

            echo "### Discovered projects"
            echo
            if [[ -s /tmp/osgi_projects.txt ]]; then
              while IFS= read -r project; do
                echo "- \`${project}\`"
              done < /tmp/osgi_projects.txt
            else
              echo "No projects discovered."
            fi

            echo
            echo "### Changed projects"
            echo
            if [[ -s /tmp/changed_projects.txt ]]; then
              while IFS= read -r project; do
                echo "- \`${project}\`"
              done < /tmp/changed_projects.txt
            else
              echo "None"
            fi

            echo
            echo "### Selected / impacted projects"
            echo
            if [[ -s /tmp/selected_projects.txt ]]; then
              while IFS= read -r project; do
                echo "- \`${project}\`"
              done < /tmp/selected_projects.txt
            else
              echo "None"
            fi

            echo
            echo "### Dependency relationships"
            echo
            if [[ -s /tmp/osgi_dependency_graph.txt ]]; then
              while IFS='|' read -r dependency dependent source; do
                echo "- \`${dependency}\` → \`${dependent}\` (${source})"
              done < /tmp/osgi_dependency_graph.txt
            else
              echo "No internal dependency relationships discovered."
            fi

          } >> "${GITHUB_STEP_SUMMARY}"
