name: OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build scenario"
        required: true
        type: choice
        default: changed
        options:
          - all
          - changed

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ============================================================
      # 3. VERIFY JAVA / MAVEN
      # ============================================================
      - name: Verify Java and Maven
        shell: bash
        run: |
          echo "========================================="
          echo "JAVA"
          echo "========================================="
          java -version

          echo
          echo "========================================="
          echo "MAVEN"
          echo "========================================="
          mvn -version

      # ============================================================
      # 4. DISCOVER PRODUCTS, TYCHO PROJECTS AND OSGi GRAPH
      # ============================================================
      - name: Discover Maven and OSGi metadata
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================="
          echo "DISCOVERING MAVEN / OSGi METADATA"
          echo "========================================="

          rm -f \
            osgi_products.txt \
            osgi_projects.txt \
            osgi_bundle_projects.txt \
            osgi_bundle_domains.txt \
            osgi_exports.txt \
            osgi_imports.txt \
            osgi_requires.txt \
            osgi_edges.txt

          touch \
            osgi_products.txt \
            osgi_projects.txt \
            osgi_bundle_projects.txt \
            osgi_bundle_domains.txt \
            osgi_exports.txt \
            osgi_imports.txt \
            osgi_requires.txt \
            osgi_edges.txt

          # --------------------------------------------------------
          # Discover top-level product directories.
          #
          # A product is a top-level directory containing pom.xml.
          # No product names are hard-coded.
          # --------------------------------------------------------
          echo
          echo "Top-level Maven products:"

          for dir in */; do
            dir="${dir%/}"

            if [[ -f "$dir/pom.xml" ]]; then
              echo "$dir" >> osgi_products.txt
              echo "  $dir"
            fi
          done

          sort -u osgi_products.txt -o osgi_products.txt

          # --------------------------------------------------------
          # Discover actual Maven/Tycho projects.
          #
          # A real OSGi bundle normally contains:
          #
          #   pom.xml
          #   META-INF/MANIFEST.MF
          #
          # Product aggregator POMs do not normally contain a
          # MANIFEST.MF, so they are not treated as JAR projects.
          # --------------------------------------------------------
          echo
          echo "Actual OSGi/Tycho projects:"

          while IFS= read -r product; do

            [[ -n "$product" ]] || continue

            while IFS= read -r pom; do

              project_dir="$(dirname "$pom")"

              manifest="$project_dir/META-INF/MANIFEST.MF"

              if [[ -f "$manifest" ]]; then

                echo "$project_dir" >> osgi_projects.txt
                echo "$project_dir" >> osgi_bundle_projects.txt

                echo "  $project_dir"

                bundle="$(
                  awk '
                    BEGIN {
                      IGNORECASE = 1
                    }

                    /^Bundle-SymbolicName:/ {
                      value = $0

                      sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                      sub(/[[:space:]]*;.*/, "", value)

                      gsub(/\r/, "", value)

                      print value
                      exit
                    }
                  ' "$manifest"
                )"

                if [[ -n "$bundle" ]]; then

                  echo "$bundle|$project_dir" \
                    >> osgi_bundle_projects.txt

                  echo "$bundle|$product|$project_dir" \
                    >> osgi_bundle_domains.txt

                  # ------------------------------------------------
                  # Export-Package
                  # ------------------------------------------------
                  awk '
                    BEGIN {
                      IGNORECASE = 1
                    }

                    /^Export-Package:/ {
                      line = $0
                      sub(/^Export-Package:[[:space:]]*/, "", line)
                      print line
                    }

                    /^[[:space:]]+/ && found {
                      print
                    }

                    /^Import-Package:/ {
                      found = 0
                    }

                    /^Require-Bundle:/ {
                      found = 0
                    }

                    /^Export-Package:/ {
                      found = 1
                    }
                  ' "$manifest" \
                  | tr '\r\n' '  ' \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r package; do
                      echo "$package|$bundle|$product" \
                        >> osgi_exports.txt
                    done

                  # ------------------------------------------------
                  # Import-Package
                  # ------------------------------------------------
                  awk '
                    BEGIN {
                      IGNORECASE = 1
                    }

                    /^Import-Package:/ {
                      line = $0
                      sub(/^Import-Package:[[:space:]]*/, "", line)
                      print line
                    }
                  ' "$manifest" \
                  | tr '\r\n' '  ' \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r package; do
                      echo "$package|$bundle|$product" \
                        >> osgi_imports.txt
                    done

                  # ------------------------------------------------
                  # Require-Bundle
                  # ------------------------------------------------
                  awk '
                    BEGIN {
                      IGNORECASE = 1
                    }

                    /^Require-Bundle:/ {
                      line = $0
                      sub(/^Require-Bundle:[[:space:]]*/, "", line)
                      print line
                    }
                  ' "$manifest" \
                  | tr '\r\n' '  ' \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r required; do
                      echo "$required|$bundle|$product" \
                        >> osgi_requires.txt
                    done

                fi
              fi

            done < <(
              find "$product" \
                -type f \
                -name "pom.xml" \
                2>/dev/null
            )

          done < osgi_products.txt

          sort -u osgi_projects.txt -o osgi_projects.txt
          sort -u osgi_bundle_domains.txt -o osgi_bundle_domains.txt
          sort -u osgi_exports.txt -o osgi_exports.txt
          sort -u osgi_imports.txt -o osgi_imports.txt
          sort -u osgi_requires.txt -o osgi_requires.txt

          # --------------------------------------------------------
          # Build package dependency edges.
          #
          # Direction:
          #
          # provider -> consumer
          #
          # Example:
          #
          # catalog -> orders
          # --------------------------------------------------------
          echo
          echo "========================================="
          echo "BUILDING OSGi DEPENDENCY GRAPH"
          echo "========================================="

          # Import-Package dependencies
          while IFS='|' read -r package consumer_bundle consumer_product; do

            [[ -n "$package" ]] || continue

            while IFS='|' read -r exported provider_bundle provider_product; do

              [[ "$package" == "$exported" ]] || continue

              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue

              echo "$provider_product|$consumer_product|package:$package" \
                >> osgi_edges.txt

            done < osgi_exports.txt

          done < osgi_imports.txt

          # Require-Bundle dependencies
          while IFS='|' read -r required consumer_bundle consumer_product; do

            [[ -n "$required" ]] || continue

            while IFS='|' read -r provider_bundle provider_product provider_project; do

              [[ "$required" == "$provider_bundle" ]] || continue

              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue

              echo "$provider_product|$consumer_product|bundle:$required" \
                >> osgi_edges.txt

            done < osgi_bundle_domains.txt

          done < osgi_requires.txt

          sort -u osgi_edges.txt -o osgi_edges.txt

          # --------------------------------------------------------
          # Display discovered metadata
          # --------------------------------------------------------
          echo
          echo "========================================="
          echo "DISCOVERED PRODUCTS"
          echo "========================================="
          cat osgi_products.txt

          echo
          echo "========================================="
          echo "DISCOVERED OSGi PROJECTS"
          echo "========================================="
          cat osgi_projects.txt

          echo
          echo "========================================="
          echo "OSGi DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s osgi_edges.txt ]]; then
            while IFS='|' read -r provider consumer reason; do
              echo "$provider -> $consumer [$reason]"
            done < osgi_edges.txt
          else
            echo "No OSGi dependencies discovered."
          fi

      # ============================================================
      # 5. DETECT CHANGED PRODUCTS
      # ============================================================
      - name: Detect changed products
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "DETECTING BUILD SCENARIO"
          echo "========================================="

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"
          else
            BUILD_MODE="changed"
          fi

          echo "Build mode: $BUILD_MODE"

          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"

          rm -f changed_products.txt
          touch changed_products.txt

          if [[ "$BUILD_MODE" == "all" ]]; then

            echo
            echo "Scenario: ALL"

            cp osgi_products.txt changed_products.txt

          else

            echo
            echo "Scenario: CHANGED"

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"

            else

              BASE_SHA="HEAD~1"

            fi

            echo "Comparing against: $BASE_SHA"

            git diff --name-only "$BASE_SHA" HEAD > changed_files.txt

            echo
            echo "Changed files:"
            cat changed_files.txt || true

            # ------------------------------------------------------
            # If root pom changes, rebuild everything.
            # ------------------------------------------------------
            if grep -qx "pom.xml" changed_files.txt 2>/dev/null; then

              echo
              echo "Root pom.xml changed."
              echo "Selecting all products."

              cp osgi_products.txt changed_products.txt

            else

              # ----------------------------------------------------
              # Map changed file to top-level product.
              # ----------------------------------------------------
              while IFS= read -r file; do

                [[ -n "$file" ]] || continue

                first_dir="${file%%/*}"

                if grep -Fxq "$first_dir" osgi_products.txt; then
                  echo "$first_dir" >> changed_products.txt
                fi

              done < changed_files.txt

            fi

            sort -u changed_products.txt -o changed_products.txt

          fi

          echo
          echo "========================================="
          echo "DIRECTLY CHANGED PRODUCTS"
          echo "========================================="

          if [[ -s changed_products.txt ]]; then
            cat changed_products.txt
          else
            echo "No product modules changed."
          fi

      # ============================================================
      # 6. RESOLVE DOWNSTREAM DEPENDENTS
      # ============================================================
      - name: Resolve impacted products
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "RESOLVING IMPACTED PRODUCTS"
          echo "========================================="

          cp changed_products.txt impacted_products.txt

          changed=1

          while [[ "$changed" -eq 1 ]]; do

            changed=0

            while IFS='|' read -r provider consumer reason; do

              [[ -n "$provider" ]] || continue

              if grep -Fxq "$provider" impacted_products.txt \
                && ! grep -Fxq "$consumer" impacted_products.txt; then

                echo "$consumer" >> impacted_products.txt

                changed=1

                echo "Impact detected:"
                echo "  $provider -> $consumer"

              fi

            done < osgi_edges.txt

            sort -u impacted_products.txt -o impacted_products.txt

          done

          echo
          echo "========================================="
          echo "ALL IMPACTED PRODUCTS"
          echo "========================================="

          cat impacted_products.txt

      # ============================================================
      # 7. CALCULATE PRODUCT BUILD ORDER
      # ============================================================
      - name: Calculate dependency build order
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "CALCULATING BUILD ORDER"
          echo "========================================="

          rm -f build_order.txt
          touch build_order.txt

          remaining="remaining_products.txt"
          cp impacted_products.txt "$remaining"

          while [[ -s "$remaining" ]]; do

            progress=0

            while IFS= read -r candidate; do

              [[ -n "$candidate" ]] || continue

              ready=1

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue

                if [[ "$consumer" == "$candidate" ]] \
                  && grep -Fxq "$provider" "$remaining"; then

                  ready=0
                  break

                fi

              done < osgi_edges.txt

              if [[ "$ready" -eq 1 ]]; then

                echo "$candidate" >> build_order.txt

                grep -Fxv "$candidate" "$remaining" \
                  > "${remaining}.tmp" || true

                mv "${remaining}.tmp" "$remaining"

                progress=1

                break

              fi

            done < "$remaining"

            if [[ "$progress" -eq 0 ]]; then

              echo
              echo "ERROR: Dependency cycle or unresolved dependency detected."
              echo
              echo "Remaining products:"
              cat "$remaining"

              exit 1

            fi

          done

          echo
          echo "========================================="
          echo "FINAL PRODUCT BUILD ORDER"
          echo "========================================="

          n=1

          while IFS= read -r product; do
            echo "$n. $product"
            n=$((n + 1))
          done < build_order.txt

      # ============================================================
      # 8. DISCOVER ACTUAL TYCHO PROJECTS TO BUILD
      # ============================================================
      - name: Resolve actual Tycho projects
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "RESOLVING ACTUAL TYCHO PROJECTS"
          echo "========================================="

          rm -f selected_projects.txt
          touch selected_projects.txt

          while IFS= read -r product; do

            [[ -n "$product" ]] || continue

            echo
            echo "Product: $product"

            while IFS= read -r project; do

              if [[ -f "$project/pom.xml" ]] \
                && [[ -f "$project/META-INF/MANIFEST.MF" ]]; then

                echo "$project" >> selected_projects.txt

                echo "  Tycho project: $project"

              fi

            done < osgi_projects.txt

          done < build_order.txt

          sort -u selected_projects.txt -o selected_projects.txt

          echo
          echo "========================================="
          echo "SELECTED TYCHO PROJECTS"
          echo "========================================="

          if [[ -s selected_projects.txt ]]; then
            cat selected_projects.txt
          else
            echo "No Tycho projects selected."
          fi

      # ============================================================
      # 9. SHOW COMPLETE BUILD PLAN
      # ============================================================
      - name: Show build plan
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "OSGi SMART BUILD PLAN"
          echo "============================================================"

          echo
          echo "BUILD MODE:"
          echo "$BUILD_MODE"

          echo
          echo "DIRECTLY CHANGED:"
          cat changed_products.txt || true

          echo
          echo "IMPACTED PRODUCTS:"
          cat impacted_products.txt || true

          echo
          echo "PRODUCT BUILD ORDER:"
          cat build_order.txt || true

          echo
          echo "ACTUAL TYCHO PROJECTS:"
          cat selected_projects.txt || true

          echo
          echo "============================================================"

      # ============================================================
      # 10. BUILD
      #
      # ALL:
      #   Build complete Maven/Tycho reactor.
      #
      # CHANGED:
      #   Build only the actual selected Tycho projects.
      #
      # IMPORTANT:
      #   We do NOT use:
      #
      #       -pl reporting
      #
      #   because reporting may be an aggregator POM.
      #
      #   Instead we dynamically pass the actual Tycho projects.
      # ============================================================
      - name: Build OSGi project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "BUILDING OSGi PROJECT"
          echo "========================================="

          if [[ "$BUILD_MODE" == "all" ]]; then

            echo
            echo "Scenario: ALL"
            echo "Building complete Maven/Tycho reactor."

            mvn -B clean package -DskipTests

          else

            echo
            echo "Scenario: CHANGED"
            echo "Building selected Tycho projects only."

            if [[ ! -s selected_projects.txt ]]; then

              echo "No impacted Tycho projects found."
              echo "Nothing to build."

              exit 0

            fi

            # Maven -pl accepts comma-separated reactor project paths.
            PROJECT_LIST="$(
              paste -sd, selected_projects.txt
            )"

            echo
            echo "Maven reactor projects:"
            echo "$PROJECT_LIST"

            echo
            echo "Running Maven package..."

            mvn -B \
              clean package \
              -pl "$PROJECT_LIST" \
              -am \
              -DskipTests

          fi

      # ============================================================
      # 11. SHOW GENERATED JAR / ZIP / WAR ARTIFACTS
      # ============================================================
      - name: Show generated artifacts
        shell: bash
        run: |
          echo "========================================="
          echo "GENERATED ARTIFACTS"
          echo "========================================="

          find . \
            -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -print

      # ============================================================
      # 12. SETUP JFROG CLI
      #
      # Required GitHub configuration:
      #
      # Repository variable:
      #   JF_URL
      #
      # Repository secret:
      #   JF_ACCESS_TOKEN
      #
      # This step does not affect Maven dependency resolution.
      # GitHub Actions Maven cache continues to be used.
      # ============================================================
      - name: Setup JFrog CLI
        if: success() && env.JF_URL != ''
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # ============================================================
      # 13. CONFIGURE JFROG
      # ============================================================
      - name: Configure JFrog
        if: success() && vars.JF_URL != '' && secrets.JF_ACCESS_TOKEN != ''
        shell: bash
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          jf c add artifactory \
            --url="$JF_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            --interactive=false

          echo "JFrog configured successfully."

      # ============================================================
      # 14. PUBLISH JARs TO JFROG
      #
      # Uses package output.
      #
      # No Maven install is performed.
      # ============================================================
      - name: Publish JARs to JFrog
        if: success() && vars.JF_URL != '' && secrets.JF_ACCESS_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "PUBLISHING JARs TO JFROG"
          echo "========================================="

          JF_REPO="${{ vars.JF_REPO }}"

          if [[ -z "$JF_REPO" ]]; then
            JF_REPO="osgi-local"
          fi

          echo "JFrog repository: $JF_REPO"

          find . \
            -type f \
            -path "*/target/*" \
            -name "*.jar" \
            -print

          jf rt upload \
            "**/target/*.jar" \
            "$JF_REPO/" \
            --server-id=artifactory \
            --flat=false \
            --build-name=osgi-smart-build \
            --build-number="${{ github.run_number }}"

      # ============================================================
      # 15. PUBLISH BUILD INFO
      # ============================================================
      - name: Publish JFrog Build Info
        if: success() && vars.JF_URL != '' && secrets.JF_ACCESS_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "PUBLISHING JFROG BUILD INFO"
          echo "========================================="

          jf rt build-publish \
            osgi-smart-build \
            "${{ github.run_number }}" \
            --server-id=artifactory

      # ============================================================
      # 16. FINAL SUMMARY
      # ============================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "OSGi SMART BUILD SUMMARY"
          echo "============================================================"

          echo
          echo "Build mode:"
          echo "${BUILD_MODE:-unknown}"

          echo
          echo "Changed products:"
          cat changed_products.txt 2>/dev/null || true

          echo
          echo "Impacted products:"
          cat impacted_products.txt 2>/dev/null || true

          echo
          echo "Build order:"
          cat build_order.txt 2>/dev/null || true

          echo
          echo "Generated artifacts:"
          find . \
            -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -print 2>/dev/null || true

          echo
          echo "============================================================"
