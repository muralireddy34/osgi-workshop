name: OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build scenario"
        required: true
        type: choice
        default: changed
        options:
          - all
          - changed

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:

      # ================================================================
      # CHECKOUT
      # ================================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================================================
      # JAVA
      # ================================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        shell: bash
        run: |
          set -u

          echo "========================================="
          echo "JAVA"
          echo "========================================="

          java -version

          echo
          echo "========================================="
          echo "MAVEN"
          echo "========================================="

          mvn -version

      # ================================================================
      # DISCOVER MODULES + OSGi METADATA
      # ================================================================

      - name: Discover OSGi dependency graph
        shell: bash
        run: |
          set -u
          set -o pipefail

          rm -f \
            modules.txt \
            bundles.txt \
            bundle_exports.txt \
            bundle_imports.txt \
            bundle_requires.txt \
            features.txt \
            feature_dependencies.txt \
            dependency_edges.txt

          touch \
            modules.txt \
            bundles.txt \
            bundle_exports.txt \
            bundle_imports.txt \
            bundle_requires.txt \
            features.txt \
            feature_dependencies.txt \
            dependency_edges.txt

          echo
          echo "========================================="
          echo "DISCOVERING TOP-LEVEL MODULES"
          echo "========================================="

          for directory in */; do
            directory="${directory%/}"

            if [[ -f "$directory/pom.xml" ]]; then
              echo "$directory" >> modules.txt
            fi
          done

          sort -u modules.txt -o modules.txt

          echo
          echo "Modules discovered:"
          cat modules.txt

          # ------------------------------------------------------------
          # Read an OSGi manifest header including continuation lines.
          # ------------------------------------------------------------

          read_manifest_header() {
            local manifest="$1"
            local wanted="$2"

            awk -v wanted="$wanted" '
              BEGIN {
                IGNORECASE = 1
                found = 0
                value = ""
              }

              {
                line = $0
                sub(/\r$/, "", line)

                if (line ~ "^" wanted ":[[:space:]]*") {
                  found = 1
                  sub("^" wanted ":[[:space:]]*", "", line)
                  value = line
                  next
                }

                if (found) {
                  if (line ~ /^[[:space:]]+/) {
                    sub(/^[[:space:]]+/, "", line)
                    value = value " " line
                    next
                  }

                  exit
                }
              }

              END {
                if (found) {
                  print value
                }
              }
            ' "$manifest"
          }

          # ============================================================
          # DISCOVER BUNDLES
          # ============================================================

          echo
          echo "========================================="
          echo "DISCOVERING OSGi BUNDLES"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "Module: $module"

            while IFS= read -r manifest; do

              # MANIFEST.MF:
              #   module/plugins/bundle/META-INF/MANIFEST.MF
              #
              # Actual project directory:
              #   module/plugins/bundle
              #
              project_dir="$(dirname "$(dirname "$manifest")")"

              bundle="$(
                awk '
                  BEGIN {
                    IGNORECASE = 1
                  }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)

                    print value
                    exit
                  }
                ' "$manifest"
              )"

              [[ -n "$bundle" ]] || continue

              echo "$bundle|$module|$project_dir" >> bundles.txt

              echo "  Bundle : $bundle"
              echo "  Project: $project_dir"

              # --------------------------------------------------------
              # Export-Package
              # --------------------------------------------------------

              exports="$(
                read_manifest_header "$manifest" "Export-Package"
              )"

              if [[ -n "$exports" ]]; then

                printf '%s\n' "$exports" |
                  tr ',' '\n' |
                  sed 's/^[[:space:]]*//' |
                  sed 's/[[:space:]]*;.*$//' |
                  sed '/^$/d' |
                  while IFS= read -r package; do

                    [[ -n "$package" ]] || continue

                    echo "$package|$bundle|$module" \
                      >> bundle_exports.txt

                  done

              fi

              # --------------------------------------------------------
              # Import-Package
              # --------------------------------------------------------

              imports="$(
                read_manifest_header "$manifest" "Import-Package"
              )"

              if [[ -n "$imports" ]]; then

                printf '%s\n' "$imports" |
                  tr ',' '\n' |
                  sed 's/^[[:space:]]*//' |
                  sed 's/[[:space:]]*;.*$//' |
                  sed '/^$/d' |
                  while IFS= read -r package; do

                    [[ -n "$package" ]] || continue

                    echo "$package|$bundle|$module" \
                      >> bundle_imports.txt

                  done

              fi

              # --------------------------------------------------------
              # Require-Bundle
              # --------------------------------------------------------

              requires="$(
                read_manifest_header "$manifest" "Require-Bundle"
              )"

              if [[ -n "$requires" ]]; then

                printf '%s\n' "$requires" |
                  tr ',' '\n' |
                  sed 's/^[[:space:]]*//' |
                  sed 's/[[:space:]]*;.*$//' |
                  sed '/^$/d' |
                  while IFS= read -r required_bundle; do

                    [[ -n "$required_bundle" ]] || continue

                    echo "$required_bundle|$bundle|$module" \
                      >> bundle_requires.txt

                  done

              fi

            done < <(
              find "$module" \
                -type f \
                -path "*/META-INF/MANIFEST.MF" \
                2>/dev/null
            )

          done < modules.txt

          sort -u bundles.txt -o bundles.txt
          sort -u bundle_exports.txt -o bundle_exports.txt
          sort -u bundle_imports.txt -o bundle_imports.txt
          sort -u bundle_requires.txt -o bundle_requires.txt

          echo
          echo "========================================="
          echo "DISCOVERED BUNDLES"
          echo "========================================="

          while IFS='|' read -r bundle module project; do

            [[ -n "$bundle" ]] || continue

            echo "$module -> $bundle"
            echo "    Project: $project"

          done < bundles.txt

          # ============================================================
          # DISCOVER FEATURES
          # ============================================================

          echo
          echo "========================================="
          echo "DISCOVERING FEATURES"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            while IFS= read -r feature_xml; do

              feature_dir="$(dirname "$feature_xml")"

              feature_id="$(
                sed -n \
                  's/.*<feature[^>]*id="\([^"]*\)".*/\1/p' \
                  "$feature_xml" |
                  head -n 1
              )"

              [[ -n "$feature_id" ]] || continue

              echo "$feature_id|$module|$feature_dir" \
                >> features.txt

              echo "  Feature: $feature_id"

              # --------------------------------------------------------
              # XML import feature dependencies
              # --------------------------------------------------------

              while IFS= read -r dependency; do

                [[ -n "$dependency" ]] || continue

                echo "$dependency|$feature_id|$module" \
                  >> feature_dependencies.txt

              done < <(
                sed -n \
                  's/.*<import[^>]*feature="\([^"]*\)".*/\1/p' \
                  "$feature_xml" 2>/dev/null |
                  sed '/^$/d' ||
                  true
              )

            done < <(
              find "$module" \
                -type f \
                -name "feature.xml" \
                2>/dev/null
            )

          done < modules.txt

          sort -u features.txt -o features.txt
          sort -u feature_dependencies.txt -o feature_dependencies.txt

          echo
          echo "========================================="
          echo "DISCOVERED FEATURES"
          echo "========================================="

          if [[ -s features.txt ]]; then

            while IFS='|' read -r feature module directory; do

              [[ -n "$feature" ]] || continue

              echo "$module -> $feature"

            done < features.txt

          else
            echo "No features discovered."
          fi

          # ============================================================
          # BUILD PACKAGE DEPENDENCY GRAPH
          # ============================================================

          echo
          echo "========================================="
          echo "BUILDING PACKAGE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r imported_package consumer_bundle consumer_module; do

            [[ -n "$imported_package" ]] || continue

            while IFS='|' read -r exported_package provider_bundle provider_module; do

              [[ "$imported_package" == "$exported_package" ]] || continue
              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue
              [[ "$provider_module" == "$consumer_module" ]] && continue

              echo \
                "$provider_module|$consumer_module|Import-Package:$imported_package" \
                >> dependency_edges.txt

            done < bundle_exports.txt

          done < bundle_imports.txt

          # ============================================================
          # BUILD REQUIRE-BUNDLE GRAPH
          # ============================================================

          echo
          echo "========================================="
          echo "BUILDING BUNDLE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r required_bundle consumer_bundle consumer_module; do

            [[ -n "$required_bundle" ]] || continue

            while IFS='|' read -r provider_bundle provider_module provider_project; do

              [[ "$required_bundle" == "$provider_bundle" ]] || continue
              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue
              [[ "$provider_module" == "$consumer_module" ]] && continue

              echo \
                "$provider_module|$consumer_module|Require-Bundle:$required_bundle" \
                >> dependency_edges.txt

            done < bundles.txt

          done < bundle_requires.txt

          # ============================================================
          # BUILD FEATURE GRAPH
          # ============================================================

          echo
          echo "========================================="
          echo "BUILDING FEATURE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r required_feature consumer_feature consumer_module; do

            [[ -n "$required_feature" ]] || continue

            while IFS='|' read -r provider_feature provider_module provider_dir; do

              [[ "$required_feature" == "$provider_feature" ]] || continue
              [[ "$provider_module" == "$consumer_module" ]] && continue

              echo \
                "$provider_module|$consumer_module|Feature:$required_feature" \
                >> dependency_edges.txt

            done < features.txt

          done < feature_dependencies.txt

          sort -u dependency_edges.txt -o dependency_edges.txt

          echo
          echo "========================================="
          echo "DISCOVERED DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s dependency_edges.txt ]]; then

            while IFS='|' read -r provider consumer reason; do

              echo "$provider -> $consumer"
              echo "    $reason"

            done < dependency_edges.txt

          else
            echo "No cross-module dependencies discovered."
          fi

      # ================================================================
      # DETECT CHANGES
      # ================================================================

      - name: Detect changed modules
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "DETECTING CHANGED MODULES"
          echo "========================================="

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"
          else
            BUILD_MODE="changed"
          fi

          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"

          rm -f changed_modules.txt
          touch changed_modules.txt

          if [[ "$BUILD_MODE" == "all" ]]; then

            cp modules.txt changed_modules.txt

          else

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"

            else

              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_SHA="HEAD~1"
              else
                BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
              fi

            fi

            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $(git rev-parse HEAD)"

            git diff \
              --name-only \
              "$BASE_SHA" HEAD \
              > changed_files.txt

            echo
            echo "Changed files:"
            cat changed_files.txt || true

            # ----------------------------------------------------------
            # Root pom change means the complete reactor may be affected.
            # ----------------------------------------------------------

            if grep -Fxq "pom.xml" changed_files.txt 2>/dev/null; then

              echo
              echo "Root pom.xml changed."
              echo "All modules will be rebuilt."

              cp modules.txt changed_modules.txt

            else

              while IFS= read -r file; do

                [[ -n "$file" ]] || continue

                first_directory="${file%%/*}"

                if grep -Fxq "$first_directory" modules.txt 2>/dev/null; then

                  echo "$first_directory" >> changed_modules.txt

                fi

              done < changed_files.txt

            fi

          fi

          sort -u changed_modules.txt -o changed_modules.txt

          echo
          echo "========================================="
          echo "CHANGED MODULES"
          echo "========================================="

          if [[ -s changed_modules.txt ]]; then
            cat changed_modules.txt
          else
            echo "No module changes detected."
          fi

      # ================================================================
      # COMPLETE UPSTREAM + DOWNSTREAM CLOSURE
      # ================================================================

      - name: Resolve impacted modules
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "RESOLVING COMPLETE IMPACTED CLOSURE"
          echo "========================================="

          rm -f impacted_modules.txt
          touch impacted_modules.txt

          if [[ "$BUILD_MODE" == "all" ]]; then

            cp modules.txt impacted_modules.txt

          else

            cp changed_modules.txt impacted_modules.txt

            changed=1

            while [[ "$changed" -eq 1 ]]; do

              changed=0

              # --------------------------------------------------------
              # UPSTREAM
              #
              # provider -> consumer
              #
              # If consumer is impacted, provider is required.
              # --------------------------------------------------------

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue
                [[ -n "$consumer" ]] || continue

                if grep -Fxq "$consumer" impacted_modules.txt 2>/dev/null &&
                   ! grep -Fxq "$provider" impacted_modules.txt 2>/dev/null; then

                  echo "$provider" >> impacted_modules.txt
                  changed=1

                  echo
                  echo "UPSTREAM dependency discovered:"
                  echo "  $provider -> $consumer"
                  echo "  $reason"

                fi

              done < dependency_edges.txt

              sort -u impacted_modules.txt -o impacted_modules.txt

              # --------------------------------------------------------
              # DOWNSTREAM
              #
              # provider -> consumer
              #
              # If provider is impacted, consumer must be rebuilt.
              # --------------------------------------------------------

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue
                [[ -n "$consumer" ]] || continue

                if grep -Fxq "$provider" impacted_modules.txt 2>/dev/null &&
                   ! grep -Fxq "$consumer" impacted_modules.txt 2>/dev/null; then

                  echo "$consumer" >> impacted_modules.txt
                  changed=1

                  echo
                  echo "DOWNSTREAM dependent discovered:"
                  echo "  $provider -> $consumer"
                  echo "  $reason"

                fi

              done < dependency_edges.txt

              sort -u impacted_modules.txt -o impacted_modules.txt

            done

          fi

          echo
          echo "========================================="
          echo "COMPLETE IMPACTED MODULE SET"
          echo "========================================="

          if [[ -s impacted_modules.txt ]]; then
            cat impacted_modules.txt
          else
            echo "No impacted modules."
          fi

      # ================================================================
      # CALCULATE TOPOLOGICAL ORDER
      # ================================================================

      - name: Calculate dependency build order
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "CALCULATING DEPENDENCY BUILD ORDER"
          echo "========================================="

          rm -f build_order.txt
          touch build_order.txt

          cp impacted_modules.txt remaining_modules.txt

          while [[ -s remaining_modules.txt ]]; do

            progress=0

            while IFS= read -r candidate; do

              [[ -n "$candidate" ]] || continue

              ready=1

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue

                if [[ "$consumer" == "$candidate" ]] &&
                   grep -Fxq "$provider" remaining_modules.txt 2>/dev/null; then

                  ready=0
                  break

                fi

              done < dependency_edges.txt

              if [[ "$ready" -eq 1 ]]; then

                echo "$candidate" >> build_order.txt

                grep -Fxv "$candidate" remaining_modules.txt \
                  > remaining_modules.tmp || true

                mv remaining_modules.tmp remaining_modules.txt

                progress=1
                break

              fi

            done < remaining_modules.txt

            if [[ "$progress" -eq 0 ]]; then

              echo
              echo "ERROR: Unable to determine dependency order."

              echo
              echo "Remaining modules:"
              cat remaining_modules.txt

              echo
              echo "Dependency graph:"
              cat dependency_edges.txt

              exit 1

            fi

          done

          echo
          echo "========================================="
          echo "FINAL BUILD ORDER"
          echo "========================================="

          number=1

          while IFS= read -r module; do

            echo "$number. $module"

            number=$((number + 1))

          done < build_order.txt

      # ================================================================
      # BUILD
      #
      # IMPORTANT:
      #
      # Do NOT execute:
      #
      #   cd module
      #   mvn clean package
      #
      # because separate Tycho reactors cannot automatically consume
      # the freshly built OSGi bundles from previous reactors.
      #
      # Instead, use the ROOT Maven/Tycho reactor.
      #
      # ================================================================

      - name: Build OSGi reactor
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "BUILDING OSGi REACTOR"
          echo "========================================="

          if [[ "$BUILD_MODE" == "all" ]]; then

            echo
            echo "Scenario: ALL"
            echo
            echo "Executing:"
            echo "  mvn -B clean package -DskipTests"
            echo

            mvn -B clean package -DskipTests

          else

            if [[ ! -s impacted_modules.txt ]]; then

              echo
              echo "No impacted modules."
              echo "Nothing to build."

              exit 0

            fi

            echo
            echo "Changed modules:"
            cat changed_modules.txt

            echo
            echo "Impacted modules:"
            cat impacted_modules.txt

            echo
            echo "Dependency build order:"
            cat build_order.txt

            echo
            echo "========================================="
            echo "TYCHO REACTOR BUILD"
            echo "========================================="

            echo
            echo "The dependency graph above determines"
            echo "the impacted module set and order."
            echo
            echo "Maven/Tycho will now build the complete"
            echo "root reactor so OSGi artifacts are visible"
            echo "to dependent projects during resolution."
            echo

            mvn -B clean package -DskipTests

          fi

      # ================================================================
      # ARTIFACTS
      # ================================================================

      - name: Show generated artifacts
        if: always()
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "GENERATED ARTIFACTS"
          echo "========================================="

          find . \
            -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -print || true

      # ================================================================
      # FINAL SUMMARY
      # ================================================================

      - name: Final build summary
        if: always()
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "FINAL BUILD SUMMARY"
          echo "========================================="

          echo
          echo "Build mode:"
          echo "  ${BUILD_MODE:-unknown}"

          echo
          echo "Changed modules:"

          if [[ -s changed_modules.txt ]]; then
            cat changed_modules.txt
          else
            echo "  None"
          fi

          echo
          echo "Impacted modules:"

          if [[ -s impacted_modules.txt ]]; then
            cat impacted_modules.txt
          else
            echo "  None"
          fi

          echo
          echo "Calculated dependency order:"

          if [[ -s build_order.txt ]]; then

            number=1

            while IFS= read -r module; do

              echo "  $number. $module"

              number=$((number + 1))

            done < build_order.txt

          else
            echo "  None"
          fi

          echo
          echo "Generated artifacts:"

          find . \
            -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -print || true

          echo
          echo "========================================="
          echo "BUILD PROCESS FINISHED"
          echo "========================================="

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Configure JFrog
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -e

          echo "========================================="
          echo "Configuring JFrog"
          echo "========================================="

          jf config add jfrog-server \
            --url="$JFROG_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            --interactive=false \
            --overwrite

      - name: Verify JFrog connection
        run: |
          set -e

          echo "========================================="
          echo "JFrog CLI"
          echo "========================================="

          jf --version
          jf rt ping --server-id=jfrog-server

      - name: Publish artifacts to JFrog
        run: |
          set -e

          echo "========================================="
          echo "Publishing artifacts to JFrog"
          echo "========================================="

          echo "Artifacts found:"
          find . -type f \
            -path "*/target/*" \
            \( -name "*.jar" -o -name "*.zip" -o -name "*.war" \) \
            -print

          echo "========================================="
          echo "Uploading artifacts"
          echo "========================================="

          jf rt upload \
            "**/target/*.jar" \
            "maven-osgi-local/" \
            --server-id=jfrog-server

          echo "========================================="
          echo "JFrog upload completed"
          echo "========================================="
