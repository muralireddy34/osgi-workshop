name: OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build scenario"
        required: true
        type: choice
        default: changed
        options:
          - all
          - changed

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ============================================================
      # 3. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify Java and Maven
        run: |
          set -u

          echo "========================================="
          echo "JAVA"
          echo "========================================="

          java -version

          echo
          echo "========================================="
          echo "MAVEN"
          echo "========================================="

          mvn -version


      # ============================================================
      # 4. DISCOVER MODULES AND OSGi METADATA
      #
      # No product/module names are hard-coded.
      #
      # Top-level directories containing pom.xml are treated as
      # build modules/products.
      #
      # Inside every module we inspect:
      #
      #   pom.xml
      #   META-INF/MANIFEST.MF
      #
      # The OSGi graph is:
      #
      #   provider -> consumer
      # ============================================================
      - name: Discover modules and OSGi dependencies
        shell: bash
        run: |
          set -u
          set -o pipefail

          echo
          echo "========================================="
          echo "DISCOVERING TOP-LEVEL MODULES"
          echo "========================================="

          rm -f \
            modules.txt \
            bundles.txt \
            bundle_exports.txt \
            bundle_imports.txt \
            bundle_requires.txt \
            dependency_edges.txt

          touch \
            modules.txt \
            bundles.txt \
            bundle_exports.txt \
            bundle_imports.txt \
            bundle_requires.txt \
            dependency_edges.txt


          # --------------------------------------------------------
          # Discover top-level modules.
          #
          # Example:
          #
          # catalog/
          # customer/
          # orders/
          #
          # No names are hard-coded.
          # --------------------------------------------------------
          for directory in */; do
            directory="${directory%/}"

            if [[ -f "$directory/pom.xml" ]]; then
              echo "$directory" >> modules.txt
            fi
          done

          sort -u modules.txt -o modules.txt

          echo
          echo "Discovered modules:"
          cat modules.txt


          # --------------------------------------------------------
          # Helper function:
          # Read an OSGi manifest header including continuation
          # lines.
          #
          # OSGi manifests commonly look like:
          #
          # Import-Package: package.one,
          #  package.two,
          #  package.three
          #
          # This function joins continuation lines.
          # --------------------------------------------------------
          read_manifest_header() {
            local manifest="$1"
            local header="$2"

            awk -v wanted="$header" '
              BEGIN {
                IGNORECASE = 1
                found = 0
                value = ""
              }

              {
                line = $0
                sub(/\r$/, "", line)

                if (line ~ "^" wanted ":[[:space:]]*") {
                  found = 1
                  sub("^" wanted ":[[:space:]]*", "", line)
                  value = line
                  next
                }

                if (found) {
                  if (line ~ /^[[:space:]]+/) {
                    sub(/^[[:space:]]+/, "", line)
                    value = value " " line
                    next
                  }

                  exit
                }
              }

              END {
                if (found) {
                  print value
                }
              }
            ' "$manifest"
          }


          # --------------------------------------------------------
          # Discover every OSGi bundle inside every module.
          # --------------------------------------------------------
          echo
          echo "========================================="
          echo "DISCOVERING OSGi BUNDLES"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "Module: $module"

            while IFS= read -r manifest; do

              project_dir="$(dirname "$manifest")"

              bundle="$(
                awk '
                  BEGIN {
                    IGNORECASE = 1
                  }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)
                    print value
                    exit
                  }
                ' "$manifest"
              )"

              if [[ -z "$bundle" ]]; then
                continue
              fi

              echo "$bundle|$module|$project_dir" >> bundles.txt

              echo "  Bundle : $bundle"
              echo "  Project: $project_dir"


              # ----------------------------------------------------
              # Export-Package
              # ----------------------------------------------------
              exports="$(read_manifest_header "$manifest" "Export-Package")"

              if [[ -n "$exports" ]]; then
                printf '%s\n' "$exports" \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r package; do

                      echo "$package|$bundle|$module" \
                        >> bundle_exports.txt

                    done
              fi


              # ----------------------------------------------------
              # Import-Package
              # ----------------------------------------------------
              imports="$(read_manifest_header "$manifest" "Import-Package")"

              if [[ -n "$imports" ]]; then
                printf '%s\n' "$imports" \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r package; do

                      echo "$package|$bundle|$module" \
                        >> bundle_imports.txt

                    done
              fi


              # ----------------------------------------------------
              # Require-Bundle
              # ----------------------------------------------------
              requires="$(read_manifest_header "$manifest" "Require-Bundle")"

              if [[ -n "$requires" ]]; then
                printf '%s\n' "$requires" \
                  | tr ',' '\n' \
                  | sed 's/^[[:space:]]*//' \
                  | sed 's/[[:space:]]*;.*$//' \
                  | sed '/^$/d' \
                  | while IFS= read -r required_bundle; do

                      echo "$required_bundle|$bundle|$module" \
                        >> bundle_requires.txt

                    done
              fi

            done < <(
              find "$module" \
                -type f \
                -path "*/META-INF/MANIFEST.MF" \
                2>/dev/null
            )

          done < modules.txt


          sort -u bundles.txt -o bundles.txt
          sort -u bundle_exports.txt -o bundle_exports.txt
          sort -u bundle_imports.txt -o bundle_imports.txt
          sort -u bundle_requires.txt -o bundle_requires.txt


          # ========================================================
          # BUILD OSGi DEPENDENCY GRAPH
          # ========================================================

          echo
          echo "========================================="
          echo "BUILDING OSGi DEPENDENCY GRAPH"
          echo "========================================="


          # --------------------------------------------------------
          # Import-Package relationships
          #
          # Exporting module -> importing module
          # --------------------------------------------------------
          while IFS='|' read -r imported_package consumer_bundle consumer_module; do

            [[ -n "$imported_package" ]] || continue

            while IFS='|' read -r exported_package provider_bundle provider_module; do

              [[ "$imported_package" == "$exported_package" ]] || continue

              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue

              if [[ "$provider_module" != "$consumer_module" ]]; then

                echo "$provider_module|$consumer_module|Import-Package:$imported_package" \
                  >> dependency_edges.txt

              fi

            done < bundle_exports.txt

          done < bundle_imports.txt


          # --------------------------------------------------------
          # Require-Bundle relationships
          #
          # Required bundle's module -> requiring module
          # --------------------------------------------------------
          while IFS='|' read -r required_bundle consumer_bundle consumer_module; do

            [[ -n "$required_bundle" ]] || continue

            while IFS='|' read -r provider_bundle provider_module provider_project; do

              [[ "$required_bundle" == "$provider_bundle" ]] || continue

              [[ "$provider_bundle" == "$consumer_bundle" ]] && continue

              if [[ "$provider_module" != "$consumer_module" ]]; then

                echo "$provider_module|$consumer_module|Require-Bundle:$required_bundle" \
                  >> dependency_edges.txt

              fi

            done < bundles.txt

          done < bundle_requires.txt


          sort -u dependency_edges.txt -o dependency_edges.txt


          # ========================================================
          # DISPLAY GRAPH
          # ========================================================

          echo
          echo "========================================="
          echo "OSGi DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s dependency_edges.txt ]]; then

            while IFS='|' read -r provider consumer reason; do
              echo "$provider -> $consumer [$reason]"
            done < dependency_edges.txt

          else
            echo "No cross-module OSGi dependencies discovered."
          fi


      # ============================================================
      # 5. DETECT CHANGED MODULES
      # ============================================================
      - name: Detect changed modules
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "DETECTING CHANGED MODULES"
          echo "========================================="

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"
          else
            BUILD_MODE="changed"
          fi

          echo "Build mode: $BUILD_MODE"

          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"

          rm -f changed_modules.txt
          touch changed_modules.txt


          # --------------------------------------------------------
          # ALL MODE
          # --------------------------------------------------------
          if [[ "$BUILD_MODE" == "all" ]]; then

            cp modules.txt changed_modules.txt

          else

            # ------------------------------------------------------
            # Determine comparison point.
            # ------------------------------------------------------
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"

            else

              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_SHA="HEAD~1"
              else
                BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
              fi

            fi


            echo "Comparing:"
            echo "  BASE: $BASE_SHA"
            echo "  HEAD: $(git rev-parse HEAD)"


            git diff \
              --name-only \
              "$BASE_SHA" HEAD \
              > changed_files.txt


            echo
            echo "Changed files:"
            cat changed_files.txt || true


            # ------------------------------------------------------
            # If root pom.xml changed, rebuild everything.
            # ------------------------------------------------------
            if grep -Fxq "pom.xml" changed_files.txt 2>/dev/null; then

              echo
              echo "Root pom.xml changed."
              echo "All modules will be rebuilt."

              cp modules.txt changed_modules.txt

            else

              while IFS= read -r file; do

                [[ -n "$file" ]] || continue

                first_directory="${file%%/*}"

                if grep -Fxq "$first_directory" modules.txt; then

                  echo "$first_directory" >> changed_modules.txt

                fi

              done < changed_files.txt

            fi

          fi


          sort -u changed_modules.txt -o changed_modules.txt


          echo
          echo "========================================="
          echo "CHANGED MODULES"
          echo "========================================="

          if [[ -s changed_modules.txt ]]; then
            cat changed_modules.txt
          else
            echo "No module changes detected."
          fi


      # ============================================================
      # 6. FIND ALL TRANSITIVE DEPENDENTS
      #
      # Example:
      #
      # catalog -> orders
      # orders  -> reporting
      #
      # Change:
      #
      # catalog
      #
      # Result:
      #
      # catalog
      # orders
      # reporting
      # ============================================================
      - name: Resolve impacted modules
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "RESOLVING IMPACTED MODULES"
          echo "========================================="

          rm -f impacted_modules.txt
          touch impacted_modules.txt

          cp changed_modules.txt impacted_modules.txt


          if [[ "$BUILD_MODE" == "all" ]]; then

            cp modules.txt impacted_modules.txt

          else

            changed=1

            while [[ "$changed" -eq 1 ]]; do

              changed=0

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue
                [[ -n "$consumer" ]] || continue

                if grep -Fxq "$provider" impacted_modules.txt \
                  && ! grep -Fxq "$consumer" impacted_modules.txt; then

                  echo "$consumer" >> impacted_modules.txt

                  changed=1

                  echo
                  echo "Impact detected:"
                  echo "  $provider -> $consumer"
                  echo "  Reason: $reason"

                fi

              done < dependency_edges.txt


              sort -u impacted_modules.txt -o impacted_modules.txt

            done

          fi


          echo
          echo "========================================="
          echo "IMPACTED MODULES"
          echo "========================================="

          if [[ -s impacted_modules.txt ]]; then
            cat impacted_modules.txt
          else
            echo "No impacted modules."
          fi


      # ============================================================
      # 7. CALCULATE MODULE BUILD ORDER
      #
      # Dependencies are always built first.
      #
      # provider -> consumer
      #
      # Therefore:
      #
      # catalog
      # orders
      # reporting
      # ============================================================
      - name: Calculate dependency build order
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "CALCULATING BUILD ORDER"
          echo "========================================="

          rm -f build_order.txt
          touch build_order.txt

          cp impacted_modules.txt remaining_modules.txt


          while [[ -s remaining_modules.txt ]]; do

            progress=0


            while IFS= read -r candidate; do

              [[ -n "$candidate" ]] || continue

              ready=1


              # ----------------------------------------------------
              # Candidate cannot be built while one of its
              # dependencies is still remaining.
              # ----------------------------------------------------
              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue

                if [[ "$consumer" == "$candidate" ]] \
                  && grep -Fxq "$provider" remaining_modules.txt; then

                  ready=0
                  break

                fi

              done < dependency_edges.txt


              if [[ "$ready" -eq 1 ]]; then

                echo "$candidate" >> build_order.txt

                grep -Fxv "$candidate" remaining_modules.txt \
                  > remaining_modules.tmp || true

                mv remaining_modules.tmp remaining_modules.txt

                progress=1

                break

              fi

            done < remaining_modules.txt


            # ------------------------------------------------------
            # Prevent infinite loop on a dependency cycle.
            # ------------------------------------------------------
            if [[ "$progress" -eq 0 ]]; then

              echo
              echo "ERROR: Unable to determine dependency order."
              echo
              echo "Remaining modules:"
              cat remaining_modules.txt

              echo
              echo "Possible dependency cycle or unresolved dependency."

              exit 1

            fi

          done


          echo
          echo "========================================="
          echo "FINAL MODULE BUILD ORDER"
          echo "========================================="

          counter=1

          while IFS= read -r module; do

            echo "$counter. $module"

            counter=$((counter + 1))

          done < build_order.txt


      # ============================================================
      # 8. SHOW BUILD PLAN
      #
      # IMPORTANT:
      #
      # We do NOT generate a Maven -pl project list.
      #
      # Each top-level module is entered and built using its own
      # Maven/Tycho reactor.
      # ============================================================
      - name: Show build plan
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "BUILD PLAN"
          echo "========================================="

          echo
          echo "Build mode:"
          echo "  $BUILD_MODE"

          echo
          echo "Changed modules:"
          cat changed_modules.txt || true

          echo
          echo "Impacted modules:"
          cat impacted_modules.txt || true

          echo
          echo "Build order:"
          cat build_order.txt || true

          echo
          echo "Each module will be built from INSIDE its own directory."
          echo
          echo "Command used for each module:"
          echo "  cd <module>"
          echo "  mvn -B clean package -DskipTests"


      # ============================================================
      # 9. BUILD
      #
      # CHANGED MODE:
      #
      #   cd module
      #   mvn clean package
      #
      # ALL MODE:
      #
      #   Run the complete root reactor.
      # ============================================================
      - name: Build modules
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "STARTING BUILD"
          echo "========================================="


          # ========================================================
          # ALL
          # ========================================================
          if [[ "$BUILD_MODE" == "all" ]]; then

            echo
            echo "Scenario: ALL"
            echo "Building complete Maven/Tycho reactor."

            mvn -B clean package -DskipTests

          else

            # ======================================================
            # CHANGED
            # ======================================================

            if [[ ! -s build_order.txt ]]; then

              echo
              echo "No impacted modules found."
              echo "Nothing to build."

              exit 0

            fi


            build_number=1


            while IFS= read -r module; do

              [[ -n "$module" ]] || continue


              echo
              echo "#########################################"
              echo "# BUILD $build_number"
              echo "# MODULE: $module"
              echo "#########################################"

              echo
              echo "Entering module:"
              echo "  $module"

              cd "$module"


              echo
              echo "Current directory:"
              pwd


              echo
              echo "Module POM:"
              if [[ -f "pom.xml" ]]; then
                echo "  pom.xml found"
              else
                echo "ERROR: pom.xml not found."
                exit 1
              fi


              echo
              echo "Building module reactor:"
              echo
              echo "  mvn -B clean package -DskipTests"
              echo

              mvn -B clean package -DskipTests


              echo
              echo "Artifacts generated by $module:"
              find . \
                -type f \
                -path "*/target/*" \
                \( \
                  -name "*.jar" \
                  -o -name "*.zip" \
                  -o -name "*.war" \
                \) \
                -print || true


              cd - >/dev/null


              build_number=$((build_number + 1))

            done < build_order.txt

          fi


      # ============================================================
      # 10. SHOW ALL GENERATED ARTIFACTS
      # ============================================================
      - name: Show generated artifacts
        if: always()
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "GENERATED ARTIFACTS"
          echo "========================================="

          find . \
            -type f \
            -path "*/target/*" \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -print || true


      # ============================================================
      # 11. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        if: always()
        shell: bash
        run: |
          set -u

          echo
          echo "========================================="
          echo "FINAL BUILD SUMMARY"
          echo "========================================="

          echo
          echo "Build mode:"
          echo "  ${BUILD_MODE:-unknown}"

          echo
          echo "Changed modules:"
          if [[ -s changed_modules.txt ]]; then
            cat changed_modules.txt
          else
            echo "  None"
          fi

          echo
          echo "Impacted modules:"
          if [[ -s impacted_modules.txt ]]; then
            cat impacted_modules.txt
          else
            echo "  None"
          fi

          echo
          echo "Build order:"
          if [[ -s build_order.txt ]]; then

            number=1

            while IFS= read -r module; do
              echo "  $number. $module"
              number=$((number + 1))
            done < build_order.txt

          else
            echo "  None"
          fi

          echo
          echo "========================================="
          echo "BUILD COMPLETE"
          echo "========================================="
