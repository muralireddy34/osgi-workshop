name: OSGi Workshop - Smart Build Pipeline

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      scenario:
        description: "Choose Build Scenario"
        required: true
        default: "changed"
        type: choice
        options:
          - all
          - changed

jobs:
  build-pipeline:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. SETUP JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ============================================================
      # 3. VERIFY JAVA AND MAVEN
      # ============================================================
      - name: Verify Java and Maven
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "JAVA VERSION"
          echo "=================================================="

          java -version

          echo ""
          echo "=================================================="
          echo "MAVEN VERSION"
          echo "=================================================="

          mvn -version

      # ============================================================
      # 4. DETECT CHANGED FILES
      # ============================================================
      - name: Detect Changed Files
        id: changed-files
        if: ${{ github.event.inputs.scenario != 'all' }}
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **

      # ============================================================
      # 5. SMART DISCOVERY + DEPENDENCY GRAPH + BUILD
      # ============================================================
      - name: Run Smart Build Pipeline
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'changed' }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "🚀 INITIALIZING OSGi SMART BUILD PIPELINE"
          echo "=================================================="

          echo "Scenario: ${SCENARIO}"
          echo ""

          # ========================================================
          # DISCOVER MAVEN MODULES
          # ========================================================

          echo "=================================================="
          echo "🔎 DISCOVERING MAVEN MODULES"
          echo "=================================================="

          ALL_MODULES=$(
            find . \
              -mindepth 2 \
              -maxdepth 2 \
              -name pom.xml \
              -printf '%h\n' 2>/dev/null |
              sed -E 's|^\./||' |
              cut -d'/' -f1 |
              sort -u |
              xargs || true
          )

          if [ -z "${ALL_MODULES}" ]; then
            echo "❌ No Maven modules discovered."
            exit 1
          fi

          read -r -a MODULE_ORDER <<< "${ALL_MODULES}"

          echo ""
          echo "Discovered modules:"
          echo ""

          for module in "${MODULE_ORDER[@]}"; do
            echo "  - ${module}"
          done

          echo ""
          echo "Total discovered modules: ${#MODULE_ORDER[@]}"

          # ========================================================
          # DETERMINE DIRECTLY CHANGED MODULES
          # ========================================================

          echo ""
          echo "=================================================="
          echo "🔎 DETECTING CHANGED MODULES"
          echo "=================================================="

          DIRECTLY_CHANGED=()

          if [ "${SCENARIO}" = "all" ]; then

            DIRECTLY_CHANGED=("${MODULE_ORDER[@]}")

            echo ""
            echo "📦 Full build selected."
            echo "All discovered modules will be considered."

          else

            echo ""
            echo "Changed files:"
            echo "${CHANGED_FILES:-<none>}"

            for file in ${CHANGED_FILES:-}; do

              if [[ "${file}" =~ ^([^/]+)/ ]]; then

                module="${BASH_REMATCH[1]}"

                for discovered in "${MODULE_ORDER[@]}"; do

                  if [ "${discovered}" = "${module}" ]; then

                    if [[ ! " ${DIRECTLY_CHANGED[*]} " =~ " ${module} " ]]; then
                      DIRECTLY_CHANGED+=("${module}")
                    fi

                  fi

                done

              fi

            done

            if [ ${#DIRECTLY_CHANGED[@]} -eq 0 ]; then

              echo ""
              echo "✅ No Maven modules changed."
              echo "Nothing to build."

              exit 0

            fi

          fi

          echo ""
          echo "Directly changed modules:"
          echo ""

          for module in "${DIRECTLY_CHANGED[@]}"; do
            echo "  * ${module}"
          done

          # ========================================================
          # BUILD DEPENDENCY GRAPH
          # ========================================================

          echo ""
          echo "=================================================="
          echo "📊 BUILDING DYNAMIC MAVEN DEPENDENCY GRAPH"
          echo "=================================================="

          declare -A DEPENDS_ON

          GRAPH_FILE="osgi-dependency-graph.dot"

          echo "digraph OSGiDependencies {" > "${GRAPH_FILE}"
          echo "  rankdir=LR;" >> "${GRAPH_FILE}"
          echo "  node [shape=box];" >> "${GRAPH_FILE}"

          for module in "${MODULE_ORDER[@]}"; do

            if [ ! -f "${module}/pom.xml" ]; then
              continue
            fi

            DEPS=""

            for other in "${MODULE_ORDER[@]}"; do

              if [ "${other}" = "${module}" ]; then
                continue
              fi

              if grep -q \
                "<artifactId>${other}</artifactId>" \
                "${module}/pom.xml" 2>/dev/null; then

                DEPS="${DEPS} ${other}"

              fi

            done

            if [ -n "${DEPS}" ]; then

              DEPENDS_ON["${module}"]="${DEPS}"

              for dependency in ${DEPS}; do

                echo "  \"${module}\" -> \"${dependency}\";" \
                  >> "${GRAPH_FILE}"

              done

            fi

          done

          echo "}" >> "${GRAPH_FILE}"

          # ========================================================
          # DISPLAY DEPENDENCY RELATIONSHIPS
          # ========================================================

          echo ""
          echo "=================================================="
          echo "📈 DETECTED DEPENDENCY RELATIONSHIPS"
          echo "=================================================="
          echo ""

          for module in "${MODULE_ORDER[@]}"; do

            MARKER=" "

            if [[ " ${DIRECTLY_CHANGED[*]} " =~ " ${module} " ]]; then
              MARKER="*"
            fi

            if [ -n "${DEPENDS_ON[${module}]:-}" ]; then

              echo "  ${module}${MARKER} -> [${DEPENDS_ON[${module}]}]"

            else

              echo "  ${module}${MARKER}"

            fi

          done

          echo ""
          echo "Legend:"
          echo "  * = directly changed module"

          # ========================================================
          # CALCULATE DEPENDENCY CLOSURE
          # ========================================================

          echo ""
          echo "=================================================="
          echo "🔗 CALCULATING DEPENDENCY CLOSURE"
          echo "=================================================="

          FINAL_SET=("${DIRECTLY_CHANGED[@]}")
          QUEUE=("${DIRECTLY_CHANGED[@]}")
          VISITED=()

          while [ ${#QUEUE[@]} -gt 0 ]; do

            CURRENT="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")

            if [[ " ${VISITED[*]} " =~ " ${CURRENT} " ]]; then
              continue
            fi

            VISITED+=("${CURRENT}")

            # ------------------------------------------------------
            # Add dependencies of current module
            # ------------------------------------------------------

            if [ -n "${DEPENDS_ON[${CURRENT}]:-}" ]; then

              for dependency in ${DEPENDS_ON[${CURRENT}]}; do

                if [[ ! " ${FINAL_SET[*]} " =~ " ${dependency} " ]]; then

                  FINAL_SET+=("${dependency}")
                  QUEUE+=("${dependency}")

                fi

              done

            fi

            # ------------------------------------------------------
            # Add modules which depend on current module
            # ------------------------------------------------------

            for candidate in "${MODULE_ORDER[@]}"; do

              if [ "${candidate}" = "${CURRENT}" ]; then
                continue
              fi

              if [[ " ${DEPENDS_ON[${candidate}]:-} " =~ " ${CURRENT} " ]]; then

                if [[ ! " ${FINAL_SET[*]} " =~ " ${candidate} " ]]; then

                  FINAL_SET+=("${candidate}")
                  QUEUE+=("${candidate}")

                fi

              fi

            done

          done

          # ========================================================
          # PRESERVE DISCOVERED / REACTOR ORDER
          # ========================================================

          ORDERED_FINAL=()

          for module in "${MODULE_ORDER[@]}"; do

            if [[ " ${FINAL_SET[*]} " =~ " ${module} " ]]; then

              ORDERED_FINAL+=("${module}")

            fi

          done

          # ========================================================
          # BUILD MAVEN -PL VALUE
          # ========================================================

          MAVEN_PL=""

          if [ ${#ORDERED_FINAL[@]} -gt 0 ]; then

            MAVEN_PL=$(IFS=,; echo "${ORDERED_FINAL[*]}")

          fi

          # ========================================================
          # DISPLAY FINAL BUILD PLAN
          # ========================================================

          echo ""
          echo "=================================================="
          echo "📋 FINAL SMART BUILD PLAN"
          echo "=================================================="

          echo ""
          echo "Scenario:"
          echo "  ${SCENARIO}"

          echo ""
          echo "Directly changed modules:"
          echo "  ${DIRECTLY_CHANGED[*]}"

          echo ""
          echo "Dependency closure:"
          echo "  ${FINAL_SET[*]}"

          echo ""
          echo "Final selected modules:"
          echo "  ${ORDERED_FINAL[*]}"

          echo ""
          echo "Maven -pl:"
          echo "  ${MAVEN_PL}"

          echo ""
          echo "Dependency graph:"
          echo "  ${GRAPH_FILE}"

          # ========================================================
          # MAVEN BUILD
          # ========================================================

          echo ""
          echo "=================================================="
          echo "🔨 MAVEN REACTOR BUILD"
          echo "=================================================="

          echo ""
          echo "External dependencies:"
          echo "  Maven Central / Maven cache"

          echo ""
          echo "Build command:"
          echo "  mvn -B clean package -pl \"${MAVEN_PL}\" -am -DskipTests"

          echo ""

          mvn -B \
            clean package \
            -pl "${MAVEN_PL}" \
            -am \
            -DskipTests

          echo ""
          echo "=================================================="
          echo "✅ MAVEN BUILD COMPLETED"
          echo "=================================================="

      # ============================================================
      # 6. UPLOAD DEPENDENCY GRAPH
      # ============================================================
      - name: Upload Dependency Graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgi-dependency-graph
          path: osgi-dependency-graph.dot
          if-no-files-found: warn

      # ============================================================
      # 7. SETUP JFROG CLI
      # ============================================================
      - name: Setup JFrog CLI
        if: success()
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # ============================================================
      # 8. VERIFY JFROG AUTHENTICATION
      # ============================================================
      - name: Verify JFrog Authentication
        if: success()
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "🔐 VERIFYING JFROG AUTHENTICATION"
          echo "=================================================="

          jf rt ping

          echo ""
          echo "✅ JFrog authentication/connectivity successful."

      # ============================================================
      # 9. CONFIGURE MAVEN CREDENTIALS
      # ============================================================
      - name: Configure Maven Authentication
        if: success()
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "🔐 CONFIGURING MAVEN AUTHENTICATION"
          echo "=================================================="

          mkdir -p "${HOME}/.m2"

          cat > "${HOME}/.m2/settings.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">

            <servers>

              <server>
                <id>jfrog</id>
                <username>${JFROG_USER}</username>
                <password>${JF_ACCESS_TOKEN}</password>
              </server>

            </servers>

          </settings>
          EOF

          chmod 600 "${HOME}/.m2/settings.xml"

          echo "✅ Maven authentication configured."
          echo ""
          echo "Maven server ID: jfrog"

      # ============================================================
      # 10. VERIFY JFROG MAVEN REPOSITORY
      # ============================================================
      - name: Verify JFrog Maven Repository
        if: success()
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "🔎 VERIFYING JFROG MAVEN REPOSITORY"
          echo "=================================================="

          REPO_URL="${JFROG_URL}/artifactory/maven-osgi-local"

          echo ""
          echo "Repository:"
          echo "  ${REPO_URL}"

          echo ""
          echo "Testing authenticated access..."

          HTTP_STATUS=$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${JF_ACCESS_TOKEN}" \
              "${REPO_URL}/"
          )

          echo "HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" = "401" ]; then

            echo ""
            echo "❌ Authentication failed."
            echo ""
            echo "Check:"
            echo "  - JF_ACCESS_TOKEN"
            echo "  - Token expiration"
            echo "  - Artifactory user"
            echo "  - Repository permissions"
            exit 1

          fi

          if [ "${HTTP_STATUS}" = "403" ]; then

            echo ""
            echo "❌ Access forbidden."
            echo ""
            echo "The token is recognized but the user/token"
            echo "does not have sufficient repository permissions."
            exit 1

          fi

          echo ""
          echo "✅ JFrog Maven repository is reachable."

      # ============================================================
      # 11. DEPLOY ALREADY-BUILT ARTIFACTS
      # ============================================================
      - name: Publish Maven Artifacts to JFrog
        if: success()
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "📦 PUBLISHING MAVEN ARTIFACTS TO JFROG"
          echo "=================================================="

          JFROG_REPO_URL="${JFROG_URL}/artifactory/maven-osgi-local"

          echo ""
          echo "Deployment repository:"
          echo "  ${JFROG_REPO_URL}"

          echo ""
          echo "Artifacts were already generated during:"
          echo "  mvn clean package"

          echo ""
          echo "Deploying existing Maven reactor artifacts."

          echo ""
          echo "IMPORTANT:"
          echo "No 'jf mvn deploy' is used."
          echo "Maven dependency resolution remains Maven Central."
          echo "JFrog is used only as the deployment repository."

          echo ""

          mvn -B \
            -s "${HOME}/.m2/settings.xml" \
            org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy \
            -DaltDeploymentRepository=jfrog::${JFROG_REPO_URL} \
            -DretryFailedDeploymentCount=3 \
            -DskipTests

          echo ""
          echo "=================================================="
          echo "✅ MAVEN ARTIFACTS PUBLISHED TO JFROG"
          echo "=================================================="

      # ============================================================
      # 12. FINAL SUMMARY
      # ============================================================
      - name: Build Summary
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo "🎉 OSGi SMART BUILD PIPELINE SUMMARY"
          echo "=================================================="

          echo ""
          echo "Scenario:"
          echo "${{ github.event.inputs.scenario || 'changed' }}"

          echo ""
          echo "Dependency graph:"
          echo "osgi-dependency-graph.dot"

          echo ""
          echo "Maven:"
          mvn -version | head -n 1

          echo ""
          echo "JFrog repository:"
          echo "maven-osgi-local"

          echo ""
          echo "Job status:"
          echo "${{ job.status }}"

          if [ "${{ job.status }}" = "success" ]; then
            echo ""
            echo "✅ OSGi SMART BUILD PIPELINE SUCCESSFUL"
          else
            echo ""
            echo "❌ OSGi SMART BUILD PIPELINE FAILED"
          fi

          echo ""
          echo "=================================================="
