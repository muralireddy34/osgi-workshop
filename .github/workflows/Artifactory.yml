name: OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build scenario"
        required: true
        type: choice
        default: changed
        options:
          - changed
          - all

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. JAVA 17 + MAVEN CACHE
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ============================================================
      # 3. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify Java and Maven
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "JAVA"
          echo "========================================="
          java -version

          echo
          echo "========================================="
          echo "MAVEN"
          echo "========================================="
          mvn -version

      # ============================================================
      # 4. DISCOVER MAVEN MODULES + OSGi METADATA
      # ============================================================
      - name: Discover OSGi modules and dependency graph
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================="
          echo "DISCOVERING MAVEN MODULES"
          echo "========================================="

          rm -f \
            /tmp/osgi_domains \
            /tmp/osgi_edges \
            /tmp/osgi_bundle_domains \
            /tmp/osgi_exports \
            /tmp/osgi_imports \
            /tmp/osgi_requires

          touch \
            /tmp/osgi_domains \
            /tmp/osgi_edges \
            /tmp/osgi_bundle_domains \
            /tmp/osgi_exports \
            /tmp/osgi_imports \
            /tmp/osgi_requires

          # ----------------------------------------------------------
          # Discover top-level Maven modules.
          # No module names are hard-coded.
          # ----------------------------------------------------------

          for dir in */; do
            dir="${dir%/}"

            if [[ -f "$dir/pom.xml" ]]; then
              echo "$dir" >> /tmp/osgi_domains
            fi
          done

          sort -u /tmp/osgi_domains -o /tmp/osgi_domains

          echo
          echo "Discovered modules:"
          cat /tmp/osgi_domains

          # ==========================================================
          # DISCOVER OSGi BUNDLES
          # ==========================================================

          echo
          echo "========================================="
          echo "DISCOVERING OSGi BUNDLES"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r manifest; do

              bundle="$(
                awk '
                  BEGIN { IGNORECASE = 1 }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)
                    print value
                    exit
                  }
                ' "$manifest"
              )"

              if [[ -n "$bundle" ]]; then
                echo "$bundle|$domain" >> /tmp/osgi_bundle_domains
                echo "$domain -> $bundle"
              fi

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          sort -u /tmp/osgi_bundle_domains \
            -o /tmp/osgi_bundle_domains

          # ==========================================================
          # DISCOVER EXPORT-PACKAGE
          # ==========================================================

          echo
          echo "========================================="
          echo "DISCOVERING EXPORTED PACKAGES"
          echo "========================================="

          while IFS='|' read -r bundle domain; do

            while IFS= read -r manifest; do

              awk '
                BEGIN { IGNORECASE = 1 }

                /^Export-Package:/ {
                  line = $0
                  sub(/^Export-Package:[[:space:]]*/, "", line)
                  print line
                }
              ' "$manifest" 2>/dev/null |
              tr '\r\n' '  ' |
              tr ',' '\n' |
              sed 's/[[:space:]].*//' |
              sed '/^$/d' |
              while IFS= read -r package; do
                echo "$package|$bundle|$domain" >> /tmp/osgi_exports
              done

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_bundle_domains

          # ==========================================================
          # DISCOVER IMPORT-PACKAGE
          # ==========================================================

          echo
          echo "========================================="
          echo "DISCOVERING IMPORTED PACKAGES"
          echo "========================================="

          while IFS='|' read -r bundle domain; do

            while IFS= read -r manifest; do

              awk '
                BEGIN { IGNORECASE = 1 }

                /^Import-Package:/ {
                  line = $0
                  sub(/^Import-Package:[[:space:]]*/, "", line)
                  print line
                }
              ' "$manifest" 2>/dev/null |
              tr '\r\n' '  ' |
              tr ',' '\n' |
              sed 's/[[:space:]].*//' |
              sed '/^$/d' |
              while IFS= read -r package; do
                echo "$package|$bundle|$domain" >> /tmp/osgi_imports
              done

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_bundle_domains

          # ==========================================================
          # DISCOVER REQUIRE-BUNDLE
          # ==========================================================

          echo
          echo "========================================="
          echo "DISCOVERING REQUIRED BUNDLES"
          echo "========================================="

          while IFS='|' read -r bundle domain; do

            while IFS= read -r manifest; do

              awk '
                BEGIN { IGNORECASE = 1 }

                /^Require-Bundle:/ {
                  line = $0
                  sub(/^Require-Bundle:[[:space:]]*/, "", line)
                  print line
                }
              ' "$manifest" 2>/dev/null |
              tr '\r\n' '  ' |
              tr ',' '\n' |
              sed 's/[[:space:]].*//' |
              sed '/^$/d' |
              while IFS= read -r required; do
                echo "$required|$bundle|$domain" >> /tmp/osgi_requires
              done

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_bundle_domains

          # ==========================================================
          # PACKAGE DEPENDENCY GRAPH
          #
          # provider -> consumer
          # ==========================================================

          echo
          echo "========================================="
          echo "BUILDING PACKAGE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r package consumer consumer_domain; do

            [[ -n "$package" ]] || continue

            while IFS='|' read -r exported provider provider_domain; do

              [[ "$exported" == "$package" ]] || continue
              [[ "$provider_domain" == "$consumer_domain" ]] && continue

              echo "$provider_domain|$consumer_domain|package:$package" \
                >> /tmp/osgi_edges

            done < /tmp/osgi_exports

          done < /tmp/osgi_imports

          # ==========================================================
          # REQUIRE-BUNDLE GRAPH
          # ==========================================================

          while IFS='|' read -r required consumer consumer_domain; do

            [[ -n "$required" ]] || continue

            while IFS='|' read -r provider provider_domain; do

              [[ "$provider" == "$required" ]] || continue
              [[ "$provider_domain" == "$consumer_domain" ]] && continue

              echo "$provider_domain|$consumer_domain|bundle:$required" \
                >> /tmp/osgi_edges

            done < /tmp/osgi_bundle_domains

          done < /tmp/osgi_requires

          # Remove self dependencies and duplicates.
          awk -F'|' '
            $1 != $2 && $1 != "" && $2 != ""
          ' /tmp/osgi_edges |
          sort -u > /tmp/osgi_edges.clean

          mv /tmp/osgi_edges.clean /tmp/osgi_edges

          # ==========================================================
          # SAVE DISCOVERY DATA
          # ==========================================================

          cp /tmp/osgi_domains ./osgi_domains.txt
          cp /tmp/osgi_edges ./osgi_edges.txt
          cp /tmp/osgi_bundle_domains ./osgi_bundle_domains.txt
          cp /tmp/osgi_exports ./osgi_exports.txt
          cp /tmp/osgi_imports ./osgi_imports.txt
          cp /tmp/osgi_requires ./osgi_requires.txt

          # ==========================================================
          # DISPLAY GRAPH
          # ==========================================================

          echo
          echo "========================================="
          echo "OSGi DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s /tmp/osgi_edges ]]; then

            while IFS='|' read -r provider consumer reason; do
              echo "$provider -> $consumer [$reason]"
            done < /tmp/osgi_edges

          else
            echo "No cross-module OSGi dependencies discovered."
          fi

      # ============================================================
      # 5. DETECT CHANGED MODULES
      # ============================================================
      - name: Detect changed products
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================="
          echo "DETECTING CHANGED MODULES"
          echo "========================================="

          MODE="${{ inputs.build_mode }}"

          if [[ -z "$MODE" ]]; then
            MODE="changed"
          fi

          echo "Build mode: $MODE"

          echo "BUILD_MODE=$MODE" >> "$GITHUB_ENV"

          rm -f changed_domains.txt
          touch changed_domains.txt

          # ==========================================================
          # ALL
          # ==========================================================

          if [[ "$MODE" == "all" ]]; then

            cp osgi_domains.txt changed_domains.txt

          else

            # ========================================================
            # DETERMINE BASE COMMIT
            # ========================================================

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"

            else

              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_SHA="$(git rev-parse HEAD~1)"
              else
                BASE_SHA=""
              fi

            fi

            echo "Base SHA: ${BASE_SHA:-none}"

            # ========================================================
            # NO BASE COMMIT
            # ========================================================

            if [[ -z "$BASE_SHA" ]]; then

              cp osgi_domains.txt changed_domains.txt

            else

              CHANGED_FILES="$(
                git diff --name-only "$BASE_SHA" HEAD
              )"

              echo
              echo "Changed files:"
              echo "$CHANGED_FILES"

              # ======================================================
              # ROOT POM CHANGED
              # ======================================================

              ROOT_CHANGED=0

              while IFS= read -r file; do

                case "$file" in
                  pom.xml|.mvn/extensions.xml|.mvn/maven.config)
                    ROOT_CHANGED=1
                    ;;
                esac

              done <<< "$CHANGED_FILES"

              if [[ "$ROOT_CHANGED" -eq 1 ]]; then

                echo
                echo "Root Maven configuration changed."
                echo "Selecting all modules."

                cp osgi_domains.txt changed_domains.txt

              else

                # ====================================================
                # MAP CHANGED FILE TO DISCOVERED MODULE
                # ====================================================

                while IFS= read -r file; do

                  [[ -n "$file" ]] || continue

                  domain="${file%%/*}"

                  if grep -Fxq "$domain" osgi_domains.txt; then
                    echo "$domain" >> changed_domains.txt
                  fi

                done <<< "$CHANGED_FILES"

                sort -u changed_domains.txt \
                  -o changed_domains.txt

              fi

            fi

          fi

          echo
          echo "========================================="
          echo "DIRECTLY CHANGED MODULES"
          echo "========================================="

          if [[ -s changed_domains.txt ]]; then
            cat changed_domains.txt
          else
            echo "No product modules changed."
          fi

      # ============================================================
      # 6. RESOLVE DOWNSTREAM DEPENDENTS
      # ============================================================
      - name: Resolve dependency closure
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================="
          echo "RESOLVING DEPENDENCIES AND DEPENDENTS"
          echo "========================================="

          rm -f selected_domains.txt
          touch selected_domains.txt

          cat changed_domains.txt >> selected_domains.txt

          sort -u selected_domains.txt \
            -o selected_domains.txt

          # ----------------------------------------------------------
          # Graph direction:
          #
          # provider -> consumer
          #
          # If provider is selected, consumer must also be selected.
          #
          # Repeat until no new modules are found.
          # ----------------------------------------------------------

          changed=1

          while [[ "$changed" -eq 1 ]]; do

            changed=0

            while IFS='|' read -r provider consumer reason; do

              [[ -n "$provider" ]] || continue
              [[ -n "$consumer" ]] || continue

              if grep -Fxq "$provider" selected_domains.txt &&
                 ! grep -Fxq "$consumer" selected_domains.txt
              then

                echo "Adding dependent: $provider -> $consumer"

                echo "$consumer" >> selected_domains.txt

                sort -u selected_domains.txt \
                  -o selected_domains.txt

                changed=1

              fi

            done < osgi_edges.txt

          done

          echo
          echo "========================================="
          echo "FINAL SELECTED MODULES"
          echo "========================================="

          cat selected_domains.txt

      # ============================================================
      # 7. CALCULATE TOPOLOGICAL BUILD ORDER
      # ============================================================
      - name: Calculate build order
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================="
          echo "CALCULATING BUILD ORDER"
          echo "========================================="

          rm -f build_order.txt
          rm -f done_domains.txt

          touch build_order.txt
          touch done_domains.txt

          total="$(wc -l < selected_domains.txt | tr -d ' ')"
          count=0

          while [[ "$count" -lt "$total" ]]; do

            progress=0

            while IFS= read -r candidate; do

              [[ -n "$candidate" ]] || continue

              if grep -Fxq "$candidate" done_domains.txt; then
                continue
              fi

              ready=1

              # ------------------------------------------------------
              # Every provider of candidate must already be built.
              # ------------------------------------------------------

              while IFS='|' read -r provider consumer reason; do

                [[ "$consumer" == "$candidate" ]] || continue

                if grep -Fxq "$provider" selected_domains.txt; then

                  if ! grep -Fxq "$provider" done_domains.txt; then
                    ready=0
                    break
                  fi

                fi

              done < osgi_edges.txt

              if [[ "$ready" -eq 1 ]]; then

                echo "$candidate" >> build_order.txt
                echo "$candidate" >> done_domains.txt

                count=$((count + 1))
                progress=1

              fi

            done < selected_domains.txt

            # --------------------------------------------------------
            # Protect against cycles/unresolved dependencies.
            # --------------------------------------------------------

            if [[ "$progress" -eq 0 ]]; then

              echo
              echo "ERROR: Unable to calculate complete build order."
              echo
              echo "Possible circular or unresolved dependency."
              echo
              echo "Remaining modules:"

              while IFS= read -r candidate; do

                if ! grep -Fxq "$candidate" done_domains.txt; then
                  echo "  $candidate"
                fi

              done < selected_domains.txt

              echo
              echo "Dependency graph:"
              cat osgi_edges.txt

              exit 1
            fi

          done

          echo
          echo "========================================="
          echo "FINAL BUILD ORDER"
          echo "========================================="

          nl -ba build_order.txt

      # ============================================================
      # 8. DISPLAY SMART BUILD PLAN
      # ============================================================
      - name: Display build plan
        shell: bash
        run: |
          echo "========================================="
          echo "OSGi SMART BUILD PLAN"
          echo "========================================="

          echo
          echo "Build mode:"
          echo "$BUILD_MODE"

          echo
          echo "Directly changed modules:"
          if [[ -s changed_domains.txt ]]; then
            cat changed_domains.txt
          else
            echo "None"
          fi

          echo
          echo "Selected modules:"
          cat selected_domains.txt

          echo
          echo "Build order:"
          nl -ba build_order.txt

          echo
          echo "========================================="
          echo "DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s osgi_edges.txt ]]; then
            cat osgi_edges.txt
          else
            echo "No cross-module dependencies."
          fi

      # ============================================================
      # 9. CLEAN SELECTED MODULES
      # ============================================================
      - name: Clean selected modules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "CLEANING SELECTED MODULES"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "Cleaning: $module"

            mvn -B \
              -pl "$module" \
              clean

          done < build_order.txt

      # ============================================================
      # 10. BUILD SELECTED MODULES
      # ============================================================
      - name: Build selected modules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "BUILDING SELECTED MODULES"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "========================================="
            echo "BUILDING MODULE: $module"
            echo "========================================="

            mvn -B \
              -pl "$module" \
              package \
              -DskipTests

          done < build_order.txt

      # ============================================================
      # 11. SHOW GENERATED ARTIFACTS
      # ============================================================
      - name: Show generated artifacts
        shell: bash
        run: |
          echo "========================================="
          echo "GENERATED ARTIFACTS"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "Artifacts for: $module"

            find "$module" \
              -path "*/target/*" \
              -type f \
              \( \
                -name "*.jar" \
                -o -name "*.zip" \
                -o -name "*.war" \
              \) \
              -print

          done < build_order.txt

      # ============================================================
      # 12. SETUP JFROG CLI
      # ============================================================
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # ============================================================
      # 13. CONFIGURE JFROG
      # ============================================================
      - name: Configure JFrog
        shell: bash
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "CONFIGURING JFROG"
          echo "========================================="

          jf c add artifactory \
            --url="$JF_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            --interactive=false

          jf c show artifactory

      # ============================================================
      # 14. PUBLISH MAVEN ARTIFACTS TO JFROG
      # ============================================================
      - name: Publish artifacts to JFrog
        shell: bash
        env:
          JF_URL: ${{ vars.JF_URL }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "PUBLISHING ARTIFACTS TO JFROG"
          echo "========================================="

          # ----------------------------------------------------------
          # Select repository based on Maven version.
          #
          # SNAPSHOT versions:
          #   osgi-snapshot-local
          #
          # Release versions:
          #   osgi-local
          # ----------------------------------------------------------

          VERSION="$(
            mvn -q \
              -DforceStdout \
              help:evaluate \
              -Dexpression=project.version
          )"

          echo "Project version: $VERSION"

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            DEPLOY_REPO="osgi-snapshot-local"
          else
            DEPLOY_REPO="osgi-local"
          fi

          echo "Deploy repository: $DEPLOY_REPO"

          # ----------------------------------------------------------
          # Deploy Maven artifacts.
          #
          # This uses the standard Maven repository layout.
          # ----------------------------------------------------------

          jf rt upload \
            "**/target/*.jar" \
            "$DEPLOY_REPO/" \
            --server-id=artifactory \
            --flat=false \
            --build-name=osgi-smart-build \
            --build-number="${{ github.run_number }}"

          # Upload ZIP artifacts if present.
          jf rt upload \
            "**/target/*.zip" \
            "$DEPLOY_REPO/" \
            --server-id=artifactory \
            --flat=false \
            --build-name=osgi-smart-build \
            --build-number="${{ github.run_number }}" \
            --fail-no-op=false

      # ============================================================
      # 15. COLLECT AND PUBLISH JFROG BUILD INFO
      # ============================================================
      - name: Publish JFrog Build Info
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "PUBLISHING JFROG BUILD INFO"
          echo "========================================="

          jf rt build-publish \
            osgi-smart-build \
            "${{ github.run_number }}" \
            --server-id=artifactory

      # ============================================================
      # 16. FINAL SUMMARY
      # ============================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo "OSGi BUILD SUMMARY"
          echo "========================================="

          echo
          echo "Build mode:"
          echo "${BUILD_MODE:-unknown}"

          echo
          echo "Directly changed modules:"
          if [[ -f changed_domains.txt ]]; then
            cat changed_domains.txt
          else
            echo "None"
          fi

          echo
          echo "Selected modules:"
          if [[ -f selected_domains.txt ]]; then
            cat selected_domains.txt
          else
            echo "None"
          fi

          echo
          echo "Build order:"
          if [[ -f build_order.txt ]]; then
            nl -ba build_order.txt
          else
            echo "None"
          fi

          echo
          echo "========================================="
          echo "OSGi BUILD FINISHED"
          echo "========================================="
