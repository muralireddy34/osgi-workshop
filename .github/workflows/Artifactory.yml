name: OSGi Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build OSGi project
        run: |
          mvn -B clean package -DskipTests

      - name: Show generated artifacts
        run: |
          echo "Generated artifacts:"
          find . -path "*/target/*" -type f \
            \( -name "*.jar" -o -name "*.zip" -o -name "*.war" \) \
            -print
