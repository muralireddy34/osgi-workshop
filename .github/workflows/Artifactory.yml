name: Northwind OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build mode"
        required: true
        type: choice
        default: changed
        options:
          - changed
          - all

jobs:
  build:
    name: Smart OSGi Build
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ============================================================
      # 3. VERIFY ENVIRONMENT
      # ============================================================
      - name: Verify Java and Maven
        run: |
          echo "============================================================"
          echo "JAVA VERSION"
          echo "============================================================"
          java -version

          echo
          echo "============================================================"
          echo "MAVEN VERSION"
          echo "============================================================"
          mvn -version


      # ============================================================
      # 4. DETERMINE BUILD MODE
      # ============================================================
      - name: Determine build mode
        shell: bash
        run: |

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_MODE="${{ inputs.build_mode }}"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BUILD_MODE="changed"

          else
            BUILD_MODE="all"
          fi

          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "BUILD MODE"
          echo "============================================================"
          echo "Selected mode: $BUILD_MODE"


      # ============================================================
      # 5. DISCOVER ALL OSGi MODULES
      #
      # A module is discovered from:
      #
      #   META-INF/MANIFEST.MF  -> OSGi bundle
      #   feature.xml            -> OSGi feature
      #
      # No product/module names are hard-coded.
      # ============================================================
      - name: Discover OSGi modules
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p build-output

          : > build-output/modules.txt
          : > build-output/module-paths.txt
          : > build-output/dependencies.txt

          echo
          echo "============================================================"
          echo "DISCOVERING OSGi MODULES"
          echo "============================================================"

          declare -A MODULE_PATH

          while IFS= read -r manifest; do

            module_dir="$(dirname "$(dirname "$manifest")")"

            module_id="$(
              sed -n \
                's/^Bundle-SymbolicName:[[:space:]]*\([^;[:space:]]*\).*/\1/p' \
                "$manifest" |
              head -1
            )"

            if [[ -n "$module_id" ]]; then

              MODULE_PATH["$module_id"]="$module_dir"

              echo "$module_id|$module_dir" \
                >> build-output/module-paths.txt

              echo "PLUGIN : $module_id"
              echo "PATH   : $module_dir"
              echo

            fi

          done < <(
            find . \
              -type f \
              -path '*/META-INF/MANIFEST.MF' \
              -not -path './.git/*' |
            sort
          )


          while IFS= read -r feature; do

            module_dir="$(dirname "$feature")"

            module_id="$(
              sed -n \
                's/.*<feature[[:space:]].*id="\([^"]*\)".*/\1/p' \
                "$feature" |
              head -1
            )"

            if [[ -n "$module_id" ]]; then

              MODULE_PATH["$module_id"]="$module_dir"

              echo "$module_id|$module_dir" \
                >> build-output/module-paths.txt

              echo "FEATURE: $module_id"
              echo "PATH   : $module_dir"
              echo

            fi

          done < <(
            find . \
              -type f \
              -name 'feature.xml' \
              -not -path './.git/*' |
            sort
          )


          cut -d'|' -f1 build-output/module-paths.txt |
            sort -u |
            tee build-output/modules.txt

          echo
          echo "Total OSGi modules/features discovered:"
          wc -l < build-output/modules.txt


      # ============================================================
      # 6. BUILD DEPENDENCY GRAPH
      #
      # Sources:
      #
      #   MANIFEST.MF
      #     Require-Bundle
      #     Import-Package
      #
      #   feature.xml
      #     <requires><import feature="...">
      #     <plugin id="...">
      #
      # The graph direction is:
      #
      #     DEPENDENCY -> DEPENDENT
      #
      # Example:
      #
      #     core -> inventory
      #
      # means inventory depends on core.
      # ============================================================
      - name: Build OSGi dependency graph
        shell: bash
        run: |

          set -euo pipefail

          : > build-output/dependency-graph.txt
          : > build-output/dependency-graph.dot
          : > build-output/dependency-edges.txt

          echo "digraph OSGi {" \
            >> build-output/dependency-graph.dot

          echo "============================================================"
          echo "OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          declare -A PATH_TO_ID
          declare -A EXPORT_PACKAGE

          while IFS='|' read -r module_id module_path; do
            PATH_TO_ID["$module_path"]="$module_id"
          done < build-output/module-paths.txt


          # --------------------------------------------------------
          # Discover exported packages
          # --------------------------------------------------------
          while IFS= read -r manifest; do

            module_dir="$(dirname "$(dirname "$manifest")")"
            module_id="${PATH_TO_ID[$module_dir]:-}"

            [[ -z "$module_id" ]] && continue

            awk '
              BEGIN { capture=0 }

              /^Export-Package:/ {
                capture=1
                sub(/^Export-Package:[[:space:]]*/, "")
                print
                next
              }

              capture && /^[A-Za-z][A-Za-z0-9-]*:/ {
                capture=0
              }

              capture {
                print
              }
            ' "$manifest" |

            tr ',' '\n' |

            sed 's/[;[:space:]].*//' |

            while IFS= read -r package; do

              [[ -z "$package" ]] && continue

              EXPORT_PACKAGE["$package"]="$module_id"

            done

          done < <(
            find . \
              -type f \
              -path '*/META-INF/MANIFEST.MF' \
              -not -path './.git/*' |
            sort
          )


          # --------------------------------------------------------
          # Function to record an edge
          # dependency -> dependent
          # --------------------------------------------------------
          add_edge() {

            local dependency="$1"
            local dependent="$2"

            [[ -z "$dependency" ]] && return
            [[ -z "$dependent" ]] && return
            [[ "$dependency" == "$dependent" ]] && return

            if grep -Fxq "$dependency|$dependent" \
                build-output/dependency-edges.txt 2>/dev/null; then
              return
            fi

            echo "$dependency|$dependent" \
              >> build-output/dependency-edges.txt

          }


          # --------------------------------------------------------
          # Parse MANIFEST.MF
          # --------------------------------------------------------
          while IFS= read -r manifest; do

            module_dir="$(dirname "$(dirname "$manifest")")"
            dependent="${PATH_TO_ID[$module_dir]:-}"

            [[ -z "$dependent" ]] && continue

            echo
            echo "MODULE: $dependent"

            # ------------------------------------------------------
            # Require-Bundle
            # ------------------------------------------------------
            perl -0777 -ne '
              if (/Require-Bundle:\s*(.*?)(?=\n[A-Za-z][A-Za-z0-9-]*:|\z)/s) {
                print $1;
              }
            ' "$manifest" |

            tr ',' '\n' |

            sed 's/[;[:space:]].*//' |

            while IFS= read -r dependency; do

              [[ -z "$dependency" ]] && continue

              if grep -Fxq "$dependency" build-output/modules.txt; then

                add_edge "$dependency" "$dependent"

                echo "  $dependency -> $dependent"

              fi

            done


            # ------------------------------------------------------
            # Import-Package
            #
            # Resolve imported package against packages exported
            # by another discovered OSGi bundle.
            # ------------------------------------------------------
            awk '
              BEGIN { capture=0 }

              /^Import-Package:/ {
                capture=1
                sub(/^Import-Package:[[:space:]]*/, "")
                print
                next
              }

              capture && /^[A-Za-z][A-Za-z0-9-]*:/ {
                capture=0
              }

              capture {
                print
              }
            ' "$manifest" |

            tr ',' '\n' |

            sed 's/[;[:space:]].*//' |

            while IFS= read -r package; do

              [[ -z "$package" ]] && continue

              dependency="${EXPORT_PACKAGE[$package]:-}"

              if [[ -n "$dependency" ]]; then

                add_edge "$dependency" "$dependent"

                echo "  $dependency -> $dependent"

              fi

            done

          done < <(
            find . \
              -type f \
              -path '*/META-INF/MANIFEST.MF' \
              -not -path './.git/*' |
            sort
          )


          # --------------------------------------------------------
          # Parse feature.xml
          # --------------------------------------------------------
          while IFS= read -r feature; do

            module_dir="$(dirname "$feature")"
            dependent="${PATH_TO_ID[$module_dir]:-}"

            [[ -z "$dependent" ]] && continue

            echo
            echo "FEATURE: $dependent"

            # ------------------------------------------------------
            # Feature imports
            # ------------------------------------------------------
            grep -oE \
              '<import[[:space:]]+feature="[^"]+"' \
              "$feature" |

            sed -E 's/.*feature="([^"]+)".*/\1/' |

            while IFS= read -r dependency; do

              if grep -Fxq "$dependency" build-output/modules.txt; then

                add_edge "$dependency" "$dependent"

                echo "  $dependency -> $dependent"

              fi

            done


            # ------------------------------------------------------
            # Feature plugins
            # ------------------------------------------------------
            grep -oE \
              '<plugin[[:space:]]+id="[^"]+"' \
              "$feature" |

            sed -E 's/.*id="([^"]+)".*/\1/' |

            while IFS= read -r dependency; do

              if grep -Fxq "$dependency" build-output/modules.txt; then

                add_edge "$dependency" "$dependent"

                echo "  $dependency -> $dependent"

              fi

            done

          done < <(
            find . \
              -type f \
              -name 'feature.xml' \
              -not -path './.git/*' |
            sort
          )


          # --------------------------------------------------------
          # Generate human-readable graph
          # --------------------------------------------------------
          {

            echo
            echo "NORTHWIND OSGi DEPENDENCY GRAPH"
            echo "================================"
            echo
            echo "Direction: dependency -> dependent"
            echo

            while IFS='|' read -r dependency dependent; do
              echo "$dependency -> $dependent"
            done < <(
              sort -u build-output/dependency-edges.txt
            )

          } > build-output/dependency-graph.txt


          # --------------------------------------------------------
          # Generate DOT graph
          # --------------------------------------------------------
          while IFS='|' read -r dependency dependent; do

            printf '  "%s" -> "%s";\n' \
              "$dependency" \
              "$dependent" \
              >> build-output/dependency-graph.dot

          done < <(
            sort -u build-output/dependency-edges.txt
          )


          echo "}" >> build-output/dependency-graph.dot


          echo
          echo "============================================================"
          echo "COMPLETE DEPENDENCY GRAPH"
          echo "============================================================"

          cat build-output/dependency-graph.txt


      # ============================================================
      # 7. DETECT CHANGED MODULES
      # ============================================================
      - name: Detect changed modules
        if: env.BUILD_MODE == 'changed'
        shell: bash
        run: |

          set -euo pipefail

          : > build-output/changed-files.txt
          : > build-output/changed-modules.txt

          echo
          echo "============================================================"
          echo "DETECTING CHANGED FILES"
          echo "============================================================"


          if [[ "${{ github.event_name }}" == "pull_request" ]]; then

            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.sha }}" \
              > build-output/changed-files.txt

          else

            if git rev-parse HEAD^ >/dev/null 2>&1; then

              git diff --name-only HEAD^ HEAD \
                > build-output/changed-files.txt

            else

              echo "No previous commit found."
              echo "Treating repository as fully changed."

              find . \
                -type f \
                -not -path './.git/*' \
                > build-output/changed-files.txt

            fi

          fi


          echo
          echo "Changed files:"
          cat build-output/changed-files.txt


          echo
          echo "============================================================"
          echo "MAPPING CHANGES TO OSGi MODULES"
          echo "============================================================"


          declare -A FOUND_MODULES


          while IFS='|' read -r module_id module_path; do

            module_path="${module_path#./}"

            while IFS= read -r changed_file; do

              changed_file="${changed_file#./}"

              if [[ "$changed_file" == "$module_path"/* ]]; then

                FOUND_MODULES["$module_id"]=1

                echo "$module_id"
                echo "  changed file: $changed_file"
                echo

              fi

            done < build-output/changed-files.txt

          done < build-output/module-paths.txt


          for module in "${!FOUND_MODULES[@]}"; do
            echo "$module"
          done |
          sort |
          tee build-output/changed-modules.txt


          # --------------------------------------------------------
          # Parent/build metadata changes
          #
          # A root/aggregator POM can affect the entire reactor.
          # --------------------------------------------------------
          if grep -Eq \
            '(^|/)(pom.xml|target-platform-configuration.xml)$' \
            build-output/changed-files.txt; then

            echo
            echo "Maven build metadata changed."
            echo "Full reactor build will be used."

            echo "FULL_BUILD_REQUIRED=true" >> "$GITHUB_ENV"

          else

            echo "FULL_BUILD_REQUIRED=false" >> "$GITHUB_ENV"

          fi


          echo
          echo "============================================================"
          echo "CHANGED MODULES"
          echo "============================================================"

          cat build-output/changed-modules.txt || true


      # ============================================================
      # 8. CALCULATE ALL DEPENDENT MODULES
      #
      # If:
      #
      #     A -> B -> C
      #
      # and A changed,
      #
      # rebuild:
      #
      #     A B C
      #
      # ============================================================
      - name: Calculate affected modules
        if: env.BUILD_MODE == 'changed'
        shell: bash
        run: |

          set -euo pipefail

          : > build-output/affected-modules.txt
          : > build-output/dependency-paths.txt

          echo
          echo "============================================================"
          echo "CALCULATING AFFECTED MODULES"
          echo "============================================================"


          if [[ "${FULL_BUILD_REQUIRED:-false}" == "true" ]]; then

            echo "Full rebuild required because build metadata changed."

            cat build-output/modules.txt \
              > build-output/affected-modules.txt

          else

            declare -A AFFECTED
            declare -A QUEUE
            declare -A PARENT

            queue=()


            # ------------------------------------------------------
            # Seed with changed modules
            # ------------------------------------------------------
            while IFS= read -r module; do

              [[ -z "$module" ]] && continue

              AFFECTED["$module"]=1
              QUEUE["$module"]=1
              queue+=("$module")

            done < build-output/changed-modules.txt


            # ------------------------------------------------------
            # Traverse reverse dependency graph
            # ------------------------------------------------------
            index=0

            while [[ $index -lt ${#queue[@]} ]]; do

              current="${queue[$index]}"
              index=$((index + 1))

              while IFS='|' read -r dependency dependent; do

                [[ "$dependency" != "$current" ]] && continue

                if [[ -z "${AFFECTED[$dependent]:-}" ]]; then

                  AFFECTED["$dependent"]=1
                  QUEUE["$dependent"]=1
                  PARENT["$dependent"]="$current"

                  queue+=("$dependent")

                fi

              done < build-output/dependency-edges.txt

            done


            for module in "${!AFFECTED[@]}"; do
              echo "$module"
            done |
            sort |
            tee build-output/affected-modules.txt

          fi


          echo
          echo "============================================================"
          echo "MODULES SELECTED FOR REBUILD"
          echo "============================================================"

          nl -ba build-output/affected-modules.txt


      # ============================================================
      # 9. DISPLAY DEPENDENCY PATHS
      # ============================================================
      - name: Display dependency paths
        if: env.BUILD_MODE == 'changed'
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "============================================================"
          echo "DEPENDENCY PATHS FOR CHANGED MODULES"
          echo "============================================================"


          while IFS= read -r changed; do

            [[ -z "$changed" ]] && continue

            echo
            echo "Changed module: $changed"
            echo "--------------------------------------------"


            declare -a PATH_NODES
            PATH_NODES=("$changed")

            current="$changed"


            while true; do

              found=""

              while IFS='|' read -r dependency dependent; do

                if [[ "$dependent" == "$current" ]]; then
                  found="$dependency"
                  break
                fi

              done < build-output/dependency-edges.txt


              [[ -z "$found" ]] && break

              PATH_NODES+=("$found")
              current="$found"

            done


            for ((i=${#PATH_NODES[@]}-1; i>=0; i--)); do

              if [[ $i -eq 0 ]]; then
                printf "%s" "${PATH_NODES[$i]}"

              else
                printf "%s -> " "${PATH_NODES[$i]}"

              fi

            done

            echo

          done < build-output/changed-modules.txt


      # ============================================================
      # 10. TOPOLOGICAL BUILD ORDER
      #
      # Kahn's algorithm implemented directly in Bash.
      #
      # This is independent of the repository's module names.
      # ============================================================
      - name: Calculate build order
        shell: bash
        run: |

          set -euo pipefail

          : > build-output/build-order.txt

          echo
          echo "============================================================"
          echo "CALCULATING DEPENDENCY-AWARE BUILD ORDER"
          echo "============================================================"


          if [[ "$BUILD_MODE" == "all" ]]; then

            cp build-output/modules.txt \
              build-output/selected-for-order.txt

          else

            cp build-output/affected-modules.txt \
              build-output/selected-for-order.txt

          fi


          declare -A SELECTED
          declare -A IN_DEGREE
          declare -A ADJ


          while IFS= read -r module; do

            [[ -z "$module" ]] && continue

            SELECTED["$module"]=1
            IN_DEGREE["$module"]=0

          done < build-output/selected-for-order.txt


          # --------------------------------------------------------
          # Calculate in-degree using:
          #
          # dependency -> dependent
          # --------------------------------------------------------
          while IFS='|' read -r dependency dependent; do

            if [[ -n "${SELECTED[$dependency]:-}" ]] &&
               [[ -n "${SELECTED[$dependent]:-}" ]]; then

              IN_DEGREE["$dependent"]=$(
                (
                  echo "${IN_DEGREE[$dependent]:-0}"
                  echo 1
                ) |
                awk '{s+=$1} END {print s}'
              )

              ADJ["$dependency"]+="$dependent "

            fi

          done < build-output/dependency-edges.txt


          declare -a READY

          for module in "${!SELECTED[@]}"; do

            if [[ "${IN_DEGREE[$module]}" -eq 0 ]]; then
              READY+=("$module")
            fi

          done


          # --------------------------------------------------------
          # Deterministic ordering
          # --------------------------------------------------------
          mapfile -t READY < <(
            printf '%s\n' "${READY[@]}" |
            sort
          )


          ORDER=()


          while [[ ${#READY[@]} -gt 0 ]]; do

            current="${READY[0]}"
            READY=("${READY[@]:1}")

            ORDER+=("$current")


            for dependent in ${ADJ[$current]:-}; do

              IN_DEGREE["$dependent"]=$(
                echo "${IN_DEGREE[$dependent]}" |
                awk '{print $1-1}'
              )


              if [[ "${IN_DEGREE[$dependent]}" -eq 0 ]]; then

                READY+=("$dependent")

                mapfile -t READY < <(
                  printf '%s\n' "${READY[@]}" |
                  sort -u
                )

              fi

            done

          done


          # --------------------------------------------------------
          # Validate graph
          # --------------------------------------------------------
          expected="$(
            grep -c . build-output/selected-for-order.txt || true
          )"

          actual="${#ORDER[@]}"


          if [[ "$expected" -ne "$actual" ]]; then

            echo
            echo "ERROR: Dependency graph contains a cycle or"
            echo "unresolved dependency."
            echo
            echo "Expected modules: $expected"
            echo "Ordered modules : $actual"

            exit 1

          fi


          # --------------------------------------------------------
          # Save and display order
          # --------------------------------------------------------
          printf '%s\n' "${ORDER[@]}" \
            > build-output/build-order.txt


          echo
          echo "============================================================"
          echo "FINAL BUILD ORDER"
          echo "============================================================"


          total="${#ORDER[@]}"
          counter=1

          while IFS= read -r module; do

            printf "[%02d/%02d] %s\n" \
              "$counter" \
              "$total" \
              "$module"

            counter=$((counter + 1))

          done < build-output/build-order.txt


      # ============================================================
      # 11. FULL BUILD
      # ============================================================
      - name: Build all modules
        if: env.BUILD_MODE == 'all'
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "============================================================"
          echo "SCENARIO 1 - BUILD ALL PRODUCTS"
          echo "============================================================"

          echo
          echo "All discovered modules:"
          nl -ba build-output/modules.txt

          echo
          echo "Dependency-aware build order:"
          nl -ba build-output/build-order.txt

          echo
          echo "Starting Maven/Tycho full reactor build..."

          mvn -B clean package -DskipTests


      # ============================================================
      # 12. CHANGED-MODULE BUILD
      #
      # The selected modules are generated dynamically.
      #
      # Maven/Tycho is still responsible for the actual reactor
      # execution and OSGi resolution.
      # ============================================================
      - name: Build changed modules
        if: env.BUILD_MODE == 'changed'
        shell: bash
        run: |

          set -euo pipefail

          echo
          echo "============================================================"
          echo "SCENARIO 2 - BUILD CHANGED / AFFECTED MODULES"
          echo "============================================================"


          if [[ ! -s build-output/affected-modules.txt ]]; then

            echo
            echo "No OSGi module changes detected."
            echo "Nothing to rebuild."

            exit 0

          fi


          # --------------------------------------------------------
          # Convert selected module IDs to Maven reactor paths.
          # --------------------------------------------------------
          : > build-output/maven-project-list.txt


          while IFS= read -r module; do

            path="$(
              awk -F'|' \
                -v id="$module" \
                '$1 == id {print $2; exit}' \
                build-output/module-paths.txt
            )"


            if [[ -z "$path" ]]; then

              echo "ERROR: Cannot map module to Maven path:"
              echo "$module"

              exit 1

            fi


            echo "$path" \
              >> build-output/maven-project-list.txt

          done < build-output/build-order.txt


          echo
          echo "Maven projects selected:"
          nl -ba build-output/maven-project-list.txt


          # --------------------------------------------------------
          # Maven accepts a comma-separated -pl list.
          #
          # The list is generated automatically.
          # No module names are hard-coded.
          # --------------------------------------------------------
          PROJECT_LIST="$(
            paste -sd, build-output/maven-project-list.txt
          )"


          echo
          echo "============================================================"
          echo "MAVEN PROJECT SELECTION"
          echo "============================================================"
          echo "$PROJECT_LIST"


          echo
          echo "============================================================"
          echo "STARTING SELECTIVE TYCHO BUILD"
          echo "============================================================"


          mvn -B \
            clean package \
            -DskipTests \
            -pl "$PROJECT_LIST"


      # ============================================================
      # 13. SHOW MAVEN REACTOR SUMMARY
      # ============================================================
      - name: Show Maven/Tycho build summary
        if: always()
        shell: bash
        run: |

          echo
          echo "============================================================"
          echo "BUILD SUMMARY"
          echo "============================================================"

          if [[ -f build-output/build-order.txt ]]; then

            echo
            echo "Build order:"
            nl -ba build-output/build-order.txt

          fi


          echo
          echo "Generated artifacts:"

          find . \
            -type f \
            \( \
              -name "*.jar" \
              -o -name "*.zip" \
              -o -name "*.war" \
            \) \
            -path "*/target/*" \
            -print |
          sort


      # ============================================================
      # 14. UPLOAD GRAPH / LOG INFORMATION
      # ============================================================
      - name: Upload dependency graph and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osgi-build-analysis
          path: build-output/
          if-no-files-found: ignore
          
