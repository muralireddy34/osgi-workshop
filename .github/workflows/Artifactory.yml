name: OSGi Smart Build

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build scenario"
        required: true
        type: choice
        default: changed
        options:
          - all
          - changed

jobs:
  build:
    name: Build OSGi Project
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. Checkout complete history
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ============================================================
      # 3. Verify environment
      # ============================================================
      - name: Verify Java and Maven
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "JAVA"
          echo "========================================="
          java -version

          echo
          echo "========================================="
          echo "MAVEN"
          echo "========================================="
          mvn -version

      # ============================================================
      # 4. Discover OSGi modules and dependency graph
      # ============================================================
      - name: Discover OSGi modules and dependency graph
        shell: bash
        run: |
          set -uo pipefail

          echo
          echo "========================================="
          echo "DISCOVERING OSGi MODULES"
          echo "========================================="

          rm -f /tmp/osgi_domains
          rm -f /tmp/osgi_edges
          rm -f /tmp/osgi_bundle_domains
          rm -f /tmp/osgi_exports
          rm -f /tmp/osgi_imports
          rm -f /tmp/osgi_requires
          rm -f /tmp/feature_domains

          touch /tmp/osgi_domains
          touch /tmp/osgi_edges
          touch /tmp/osgi_bundle_domains
          touch /tmp/osgi_exports
          touch /tmp/osgi_imports
          touch /tmp/osgi_requires
          touch /tmp/feature_domains

          # ----------------------------------------------------------
          # Discover top-level Maven product/module directories.
          #
          # No product names are hard-coded.
          # ----------------------------------------------------------

          for dir in */; do
            dir="${dir%/}"

            if [[ -f "$dir/pom.xml" ]]; then
              echo "$dir" >> /tmp/osgi_domains
            fi
          done

          sort -u /tmp/osgi_domains -o /tmp/osgi_domains

          echo
          echo "Discovered product modules:"

          if [[ -s /tmp/osgi_domains ]]; then
            cat /tmp/osgi_domains
          else
            echo "ERROR: No top-level Maven modules discovered."
            exit 1
          fi

          # ----------------------------------------------------------
          # Discover OSGi bundles.
          #
          # Bundle-SymbolicName -> product module
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "DISCOVERING OSGi BUNDLES"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r manifest; do

              [[ -f "$manifest" ]] || continue

              bundle="$(
                awk '
                  BEGIN {
                    IGNORECASE = 1
                  }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)
                    print value
                    exit
                  }
                ' "$manifest"
              )"

              if [[ -n "$bundle" ]]; then
                echo "$bundle|$domain" >> /tmp/osgi_bundle_domains
                echo "$domain -> $bundle"
              fi

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          sort -u /tmp/osgi_bundle_domains -o /tmp/osgi_bundle_domains

          # ----------------------------------------------------------
          # Discover exported packages.
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "DISCOVERING EXPORTED PACKAGES"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r manifest; do

              [[ -f "$manifest" ]] || continue

              bundle="$(
                awk '
                  BEGIN {
                    IGNORECASE = 1
                  }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)
                    print value
                    exit
                  }
                ' "$manifest"
              )"

              [[ -n "$bundle" ]] || continue

              awk '
                /^Export-Package:/ {
                  value = $0
                  sub(/^Export-Package:[[:space:]]*/, "", value)
                  print value
                  in_export = 1
                  next
                }

                in_export && /^[[:space:]]+/ {
                  value = $0
                  sub(/^[[:space:]]*/, "", value)
                  print value
                  next
                }

                in_export && /^[A-Za-z0-9-]+:/ {
                  in_export = 0
                }
              ' "$manifest" |
              tr ',' '\n' |
              sed 's/^[[:space:]]*//' |
              sed 's/;.*//' |
              while IFS= read -r package; do

                [[ -n "$package" ]] || continue

                echo "$package|$bundle|$domain" \
                  >> /tmp/osgi_exports

                echo "  $domain -> $package"

              done

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          sort -u /tmp/osgi_exports -o /tmp/osgi_exports

          # ----------------------------------------------------------
          # Discover Import-Package and Require-Bundle.
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "DISCOVERING OSGi IMPORT DEPENDENCIES"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r manifest; do

              [[ -f "$manifest" ]] || continue

              bundle="$(
                awk '
                  BEGIN {
                    IGNORECASE = 1
                  }

                  /^Bundle-SymbolicName:/ {
                    value = $0
                    sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                    sub(/[[:space:]]*;.*/, "", value)
                    gsub(/\r/, "", value)
                    print value
                    exit
                  }
                ' "$manifest"
              )"

              [[ -n "$bundle" ]] || continue

              # ------------------------------------------------------
              # Import-Package
              # ------------------------------------------------------

              awk '
                /^Import-Package:/ {
                  value = $0
                  sub(/^Import-Package:[[:space:]]*/, "", value)
                  print value
                  in_import = 1
                  next
                }

                in_import && /^[[:space:]]+/ {
                  value = $0
                  sub(/^[[:space:]]*/, "", value)
                  print value
                  next
                }

                in_import && /^[A-Za-z0-9-]+:/ {
                  in_import = 0
                }
              ' "$manifest" |
              tr ',' '\n' |
              sed 's/^[[:space:]]*//' |
              sed 's/;.*//' |
              while IFS= read -r package; do

                [[ -n "$package" ]] || continue

                echo "$package|$bundle|$domain" \
                  >> /tmp/osgi_imports

                echo "  $domain imports $package"

              done

              # ------------------------------------------------------
              # Require-Bundle
              # ------------------------------------------------------

              awk '
                /^Require-Bundle:/ {
                  value = $0
                  sub(/^Require-Bundle:[[:space:]]*/, "", value)
                  print value
                  in_require = 1
                  next
                }

                in_require && /^[[:space:]]+/ {
                  value = $0
                  sub(/^[[:space:]]*/, "", value)
                  print value
                  next
                }

                in_require && /^[A-Za-z0-9-]+:/ {
                  in_require = 0
                }
              ' "$manifest" |
              tr ',' '\n' |
              sed 's/^[[:space:]]*//' |
              sed 's/;.*//' |
              while IFS= read -r required; do

                [[ -n "$required" ]] || continue

                echo "$required|$bundle|$domain" \
                  >> /tmp/osgi_requires

                echo "  $domain requires bundle $required"

              done

            done < <(
              find "$domain" \
                -type f \
                -path '*/META-INF/MANIFEST.MF' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          sort -u /tmp/osgi_imports -o /tmp/osgi_imports
          sort -u /tmp/osgi_requires -o /tmp/osgi_requires

          # ----------------------------------------------------------
          # Build dependency graph from Import-Package.
          #
          # Provider -> Consumer
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "BUILDING PACKAGE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r package consumer consumer_bundle_domain; do

            [[ -n "$package" ]] || continue

            while IFS='|' read -r exported provider provider_domain; do

              [[ "$provider_domain" == "$consumer_bundle_domain" ]] \
                && continue

              echo "$provider_domain|$consumer_bundle_domain|package:$package" \
                >> /tmp/osgi_edges

            done < <(
              awk -F'|' -v pkg="$package" '
                $1 == pkg {
                  print
                }
              ' /tmp/osgi_exports
            )

          done < /tmp/osgi_imports

          # ----------------------------------------------------------
          # Build dependency graph from Require-Bundle.
          #
          # Provider -> Consumer
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "BUILDING BUNDLE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS='|' read -r required consumer consumer_domain; do

            [[ -n "$required" ]] || continue

            while IFS='|' read -r provider provider_domain; do

              [[ "$provider_domain" == "$consumer_domain" ]] \
                && continue

              echo "$provider_domain|$consumer_domain|bundle:$required" \
                >> /tmp/osgi_edges

            done < <(
              awk -F'|' -v required="$required" '
                $1 == required {
                  print
                }
              ' /tmp/osgi_bundle_domains
            )

          done < /tmp/osgi_requires

          # ----------------------------------------------------------
          # Discover features.
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "DISCOVERING FEATURES"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r feature; do

              feature_id="$(
                awk '
                  /<feature[[:space:]]/ {

                    if (match($0, /id="[^"]+"/)) {

                      value = substr($0, RSTART, RLENGTH)

                      sub(/^id="/, "", value)
                      sub(/"$/, "", value)

                      print value
                      exit
                    }
                  }
                ' "$feature"
              )"

              if [[ -n "$feature_id" ]]; then

                echo "$feature_id|$domain" \
                  >> /tmp/feature_domains

                echo "$domain -> feature $feature_id"

              fi

            done < <(
              find "$domain" \
                -type f \
                -name 'feature.xml' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          sort -u /tmp/feature_domains -o /tmp/feature_domains

          # ----------------------------------------------------------
          # Build feature dependency graph.
          #
          # Provider feature -> Consumer product
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "BUILDING FEATURE DEPENDENCY GRAPH"
          echo "========================================="

          while IFS= read -r domain; do

            while IFS= read -r feature; do

              while IFS= read -r required_feature; do

                [[ -n "$required_feature" ]] || continue

                provider_domain="$(
                  awk -F'|' \
                    -v feature="$required_feature" '
                      $1 == feature {
                        print $2
                        exit
                      }
                    ' /tmp/feature_domains
                )"

                if [[ -n "$provider_domain" &&
                      "$provider_domain" != "$domain" ]]; then

                  echo "$provider_domain|$domain|feature:$required_feature" \
                    >> /tmp/osgi_edges

                fi

              done < <(
                sed -n \
                  's/.*<import[[:space:]]\+feature="\([^"]*\)".*/\1/p' \
                  "$feature"
              )

            done < <(
              find "$domain" \
                -type f \
                -name 'feature.xml' \
                2>/dev/null
            )

          done < /tmp/osgi_domains

          # ----------------------------------------------------------
          # Remove duplicate graph edges.
          # ----------------------------------------------------------

          sort -u /tmp/osgi_edges -o /tmp/osgi_edges

          # ----------------------------------------------------------
          # Display dependency graph.
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "PRODUCT DEPENDENCY GRAPH"
          echo "========================================="

          if [[ -s /tmp/osgi_edges ]]; then

            while IFS='|' read -r provider consumer reason; do

              echo "$provider -> $consumer [$reason]"

            done < /tmp/osgi_edges

          else

            echo "No cross-product dependencies discovered."

          fi

          # ----------------------------------------------------------
          # Display all products.
          # ----------------------------------------------------------

          echo
          echo "========================================="
          echo "ALL DISCOVERED PRODUCTS"
          echo "========================================="

          cat /tmp/osgi_domains

          # ----------------------------------------------------------
          # Save discovery information.
          # ----------------------------------------------------------

          cp /tmp/osgi_domains \
            "$GITHUB_WORKSPACE/osgi_domains.txt"

          cp /tmp/osgi_edges \
            "$GITHUB_WORKSPACE/osgi_edges.txt"

          cp /tmp/osgi_bundle_domains \
            "$GITHUB_WORKSPACE/osgi_bundle_domains.txt"

          cp /tmp/osgi_exports \
            "$GITHUB_WORKSPACE/osgi_exports.txt"

          cp /tmp/osgi_imports \
            "$GITHUB_WORKSPACE/osgi_imports.txt"

          cp /tmp/osgi_requires \
            "$GITHUB_WORKSPACE/osgi_requires.txt"

      # ============================================================
      # 5. Detect changed modules
      # ============================================================
      - name: Detect changed modules
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "DETECTING BUILD SCENARIO"
          echo "========================================="

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.build_mode }}"
          else
            MODE="changed"
          fi

          echo "Build mode: $MODE"

          echo "BUILD_MODE=$MODE" >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # Full build
          # --------------------------------------------------------

          if [[ "$MODE" == "all" ]]; then

            echo
            echo "Full build requested."

            cp osgi_domains.txt changed_domains.txt

          # --------------------------------------------------------
          # Changed build
          # --------------------------------------------------------

          else

            if [[ "${{ github.event_name }}" == "pull_request" ]]; then

              BASE_SHA="${{ github.event.pull_request.base.sha }}"

            else

              BASE_SHA="$(git rev-parse HEAD~1)"

            fi

            HEAD_SHA="${{ github.sha }}"

            echo
            echo "Base SHA:"
            echo "$BASE_SHA"

            echo
            echo "Head SHA:"
            echo "$HEAD_SHA"

            echo
            echo "Changed files:"
            git diff --name-only "$BASE_SHA" "$HEAD_SHA"

            : > changed_domains.txt

            # ------------------------------------------------------
            # Maven metadata changes can affect the complete reactor.
            # ------------------------------------------------------

            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              grep -qE '^(pom.xml|[^/]+/pom.xml)$'; then

              echo
              echo "Maven build metadata changed."
              echo "Selecting all products."

              cat osgi_domains.txt > changed_domains.txt

            else

              while IFS= read -r file; do

                [[ -z "$file" ]] && continue

                domain="${file%%/*}"

                if grep -Fxq "$domain" osgi_domains.txt; then
                  echo "$domain" >> changed_domains.txt
                fi

              done < <(
                git diff --name-only "$BASE_SHA" "$HEAD_SHA"
              )

            fi

            sort -u changed_domains.txt -o changed_domains.txt

          fi

          echo
          echo "========================================="
          echo "DIRECTLY CHANGED PRODUCTS"
          echo "========================================="

          if [[ -s changed_domains.txt ]]; then

            cat changed_domains.txt

          else

            echo "No product modules changed."

          fi

          echo
          echo "Changed products detected successfully."
          
      # ============================================================
      # 6. Resolve all downstream dependents
      # ============================================================
      - name: Resolve dependency chain
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "RESOLVING DEPENDENCY CHAIN"
          echo "========================================="

          : > selected_domains.txt

          if [[ "$BUILD_MODE" == "all" ]]; then

            cat osgi_domains.txt > selected_domains.txt

          else

            cp changed_domains.txt selected_domains.txt

            # --------------------------------------------------------
            # Resolve transitive downstream dependents.
            #
            # Graph direction:
            #
            # provider -> consumer
            #
            # Example:
            #
            # catalog -> orders
            #
            # If catalog changes:
            #
            # catalog
            # orders
            #
            # are selected.
            # --------------------------------------------------------

            changed=1

            while [[ "$changed" -eq 1 ]]; do

              changed=0

              while IFS='|' read -r provider consumer reason; do

                [[ -n "$provider" ]] || continue
                [[ -n "$consumer" ]] || continue

                if grep -Fxq "$provider" selected_domains.txt &&
                   ! grep -Fxq "$consumer" selected_domains.txt; then

                  echo
                  echo "Dependency discovered:"
                  echo "  $provider -> $consumer [$reason]"

                  echo "$consumer" >> selected_domains.txt

                  changed=1

                fi

              done < osgi_edges.txt

              sort -u selected_domains.txt -o selected_domains.txt

            done

          fi

          echo
          echo "========================================="
          echo "SELECTED PRODUCTS FOR REBUILD"
          echo "========================================="

          if [[ -s selected_domains.txt ]]; then

            cat selected_domains.txt

          else

            echo "No products selected."

          fi

          echo
          echo "Total selected:"
          wc -l < selected_domains.txt

      # ============================================================
      # 7. Calculate topological build order
      # ============================================================
      - name: Calculate build order
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "CALCULATING BUILD ORDER"
          echo "========================================="

          : > build_order.txt

          declare -A DONE

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            DONE["$module"]=0

          done < selected_domains.txt

          total=$(wc -l < selected_domains.txt)
          count=0

          while [[ "$count" -lt "$total" ]]; do

            progress=0

            while IFS= read -r module; do

              [[ -n "$module" ]] || continue

              [[ "${DONE[$module]}" -eq 1 ]] && continue

              ready=1

              # ------------------------------------------------------
              # A module is ready when every selected provider that
              # points to it has already been built.
              # ------------------------------------------------------

              while IFS='|' read -r provider consumer reason; do

                [[ "$consumer" == "$module" ]] || continue

                if grep -Fxq "$provider" selected_domains.txt &&
                   [[ "${DONE[$provider]}" -ne 1 ]]; then

                  ready=0
                  break

                fi

              done < osgi_edges.txt

              if [[ "$ready" -eq 1 ]]; then

                echo "$module" >> build_order.txt

                DONE["$module"]=1

                count=$((count + 1))
                progress=1

              fi

            done < selected_domains.txt

            # --------------------------------------------------------
            # Protect against circular dependency.
            # --------------------------------------------------------

            if [[ "$progress" -eq 0 ]]; then

              echo
              echo "ERROR: Dependency graph contains a cycle"
              echo "or a dependency could not be resolved."

              echo
              echo "Remaining modules:"

              while IFS= read -r module; do

                [[ -z "$module" ]] && continue

                if [[ "${DONE[$module]}" -eq 0 ]]; then
                  echo "  $module"
                fi

              done < selected_domains.txt

              echo
              echo "Relevant dependency edges:"

              while IFS='|' read -r provider consumer reason; do

                if grep -Fxq "$provider" selected_domains.txt &&
                   grep -Fxq "$consumer" selected_domains.txt; then

                  if [[ "${DONE[$provider]}" -eq 0 ||
                        "${DONE[$consumer]}" -eq 0 ]]; then

                    echo "  $provider -> $consumer [$reason]"

                  fi

                fi

              done < osgi_edges.txt

              exit 1

            fi

          done

          echo
          echo "========================================="
          echo "FINAL BUILD ORDER"
          echo "========================================="

          sequence=1

          while IFS= read -r module; do

            echo "$sequence. $module"

            sequence=$((sequence + 1))

          done < build_order.txt

      # ============================================================
      # 8. Display complete dependency graph and rebuild plan
      # ============================================================
      - name: Display dependency graph and rebuild plan
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "======================================================"
          echo "                 OSGi BUILD PLAN"
          echo "======================================================"

          echo
          echo "Build scenario:"
          echo "  $BUILD_MODE"

          echo
          echo "------------------------------------------------------"
          echo "ALL PRODUCTS"
          echo "------------------------------------------------------"

          cat osgi_domains.txt

          echo
          echo "------------------------------------------------------"
          echo "PRODUCT DEPENDENCY GRAPH"
          echo "------------------------------------------------------"

          if [[ -s osgi_edges.txt ]]; then

            while IFS='|' read -r provider consumer reason; do

              echo "  $provider -> $consumer [$reason]"

            done < osgi_edges.txt

          else

            echo "  No cross-product dependencies."

          fi

          echo
          echo "------------------------------------------------------"
          echo "DIRECTLY CHANGED PRODUCTS"
          echo "------------------------------------------------------"

          if [[ -s changed_domains.txt ]]; then
            cat changed_domains.txt
          else
            echo "None"
          fi

          echo
          echo "------------------------------------------------------"
          echo "PRODUCTS SELECTED FOR REBUILD"
          echo "------------------------------------------------------"

          if [[ -s selected_domains.txt ]]; then
            cat selected_domains.txt
          else
            echo "None"
          fi

          echo
          echo "------------------------------------------------------"
          echo "BUILD ORDER"
          echo "------------------------------------------------------"

          n=1

          while IFS= read -r module; do

            echo "  $n. $module"

            n=$((n + 1))

          done < build_order.txt

          echo
          echo "======================================================"

      # ============================================================
      # 9. Clean selected products
      # ============================================================
      - name: Clean selected products
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "CLEANING SELECTED PRODUCTS"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "Cleaning: $module"

            mvn -B \
              -pl "$module" \
              clean

          done < build_order.txt

      # ============================================================
      # 10. Build selected products in dependency order
      # ============================================================
      - name: Build selected products in dependency order
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "BUILDING PRODUCTS"
          echo "========================================="

          sequence=1

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "======================================================"
            echo "BUILD STEP $sequence"
            echo "PRODUCT: $module"
            echo "======================================================"

            echo
            echo "Maven command:"
            echo "mvn -B -pl $module install -DskipTests"

            mvn -B \
              -pl "$module" \
              install \
              -DskipTests

            echo
            echo "SUCCESS: $module"

            sequence=$((sequence + 1))

          done < build_order.txt

      # ============================================================
      # 11. Show generated artifacts
      # ============================================================
      - name: Show generated artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================="
          echo "GENERATED ARTIFACTS"
          echo "========================================="

          while IFS= read -r module; do

            [[ -n "$module" ]] || continue

            echo
            echo "-----------------------------------------"
            echo "PRODUCT: $module"
            echo "-----------------------------------------"

            find "$module" \
              -path "*/target/*" \
              -type f \
              \( \
                -name "*.jar" \
                -o -name "*.zip" \
                -o -name "*.war" \
              \) \
              -print

          done < build_order.txt

      # ============================================================
      # 12. Final summary
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "======================================================"
          echo "                 BUILD SUCCESSFUL"
          echo "======================================================"

          echo
          echo "Scenario:"
          echo "  $BUILD_MODE"

          echo
          echo "Products rebuilt:"

          cat selected_domains.txt

          echo
          echo "Build order:"

          n=1

          while IFS= read -r module; do

            echo "  $n. $module"

            n=$((n + 1))

          done < build_order.txt

          echo
          echo "======================================================"
