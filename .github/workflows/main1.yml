name: OSGi Workshop - Build Pipeline Assignment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose Build Scenario'
        required: true
        default: 'changed'
        type: choice
        options:
          - all
          - changed

jobs:
  build-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Detect Changed Modules
      id: changed-files
      if: ${{ github.event.inputs.scenario != 'all' }}
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **

    - name: Run Build Pipeline & Analyze Dependencies
      env:
        SCENARIO: ${{ github.event.inputs.scenario || 'changed' }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        echo "========================================="
        echo "🚀 INITIALIZING DYNAMIC OSGi PIPELINE"
        echo "========================================="
        
        # 1. DYNAMIC COMPONENT INVENTORY EXTRACTION
        ALL_DOMAINS=$(find . -maxdepth 2 -name "pom.xml" -not -path "./pom.xml" | cut -d'/' -f2 | sort | xargs)
        echo "📦 Discovered Root Modules in Repository: [ $ALL_DOMAINS ]"
        
        DIRECTLY_CHANGED=""
        FINAL_LIST=""

        if [ "$SCENARIO" = "all" ]; then
          echo "Scenario Selected: 1️⃣ Build All Products"
          FINAL_LIST=$(echo "$ALL_DOMAINS" | tr ' ' ',')
        else
          echo "Scenario Selected: 2️⃣ Build Only Changed Products/Modules"
          echo "Analyzing file modifications..."
          
          # 2. MATCH FILE MODIFICATIONS TO TOP-LEVEL COMPONENT ROOT FOLDERS
          for file in $CHANGED_FILES; do
            if [[ "$file" =~ ^([^/]+)/ ]]; then
              DOMAIN="${BASH_REMATCH[1]}"
              if [[ " $ALL_DOMAINS " =~ " $DOMAIN " ]] && [[ ! " $DIRECTLY_CHANGED " =~ " $DOMAIN " ]]; then
                DIRECTLY_CHANGED="$DIRECTLY_CHANGED $DOMAIN"
              fi
            fi
          done
          
          DIRECTLY_CHANGED=$(echo $DIRECTLY_CHANGED | xargs)
          echo "🔎 Top-level domains with explicit modifications: [ $DIRECTLY_CHANGED ]"
          
          if [ -z "$DIRECTLY_CHANGED" ]; then
             echo "✅ No core application source directories modified. Exiting safely."
             exit 0
          fi
          
          FINAL_LIST="$DIRECTLY_CHANGED"
          
          # 3. BIDIRECTIONAL METADATA GRAPH RESOLUTION (0% Hardcoding Layer)
          QUEUE=($DIRECTLY_CHANGED)
          VISITED=""
          
          while [ ${#QUEUE[@]} -gt 0 ]; do
            CURRENT_MOD="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")
            
            if [[ " $VISITED " =~ " $CURRENT_MOD " ]]; then
              continue
            fi
            VISITED="$VISITED $CURRENT_MOD"
            
            # Extract Bundle-SymbolicName dynamically for this module
            SYMBOLIC_NAME=$(grep "Bundle-SymbolicName:" $CURRENT_MOD/plugins/*/META-INF/MANIFEST.MF 2>/dev/null | head -n 1 | awk '{print $2}' | cut -d';' -f1 | xargs)
            [ -z "$SYMBOLIC_NAME" ] && SYMBOLIC_NAME="com.northwind.oms.$CURRENT_MOD"
            
            # --- DIRECTION A: SCAN DOWNSTREAM (Who needs me?) ---
            for external_domain in $ALL_DOMAINS; do
              if [ "$external_domain" != "$CURRENT_MOD" ]; then
                MANIFEST_FILES=$(find $external_domain/ -name "MANIFEST.MF" 2>/dev/null)
                MATCH_FOUND=false
                for mf in $MANIFEST_FILES; do
                  FLATTENED=$(cat "$mf" | tr -d '\n\r')
                  if [[ "$FLATTENED" =~ "$SYMBOLIC_NAME" ]] || [[ "$FLATTENED" =~ "$CURRENT_MOD" ]]; then
                    MATCH_FOUND=true
                    break
                  fi
                done
                if [ "$MATCH_FOUND" = true ] || grep -q -r "$CURRENT_MOD" "$external_domain/pom.xml" 2>/dev/null; then
                  if [[ ! " $FINAL_LIST " =~ " $external_domain " ]]; then
                    FINAL_LIST="$FINAL_LIST $external_domain"
                    QUEUE+=("$external_domain")
                  fi
                fi
              fi
            done
            
            # --- DIRECTION B: SCAN UPSTREAM (What do I need to compile safely?) ---
            # Flatten this current module's own manifests to find out its requirements
            MY_MANIFESTS=$(find $CURRENT_MOD/ -name "MANIFEST.MF" 2>/dev/null)
            for mf in $MY_MANIFESTS; do
              FLATTENED_MY_MF=$(cat "$mf" | tr -d '\n\r')
              for upstream_domain in $ALL_DOMAINS; do
                if [ "$upstream_domain" != "$CURRENT_MOD" ]; then
                  # Check if we are importing packages/bundles associated with other modules
                  if [[ "$FLATTENED_MY_MF" =~ "$upstream_domain" ]]; then
                    if [[ ! " $FINAL_LIST " =~ " $upstream_domain " ]]; then
                      FINAL_LIST="$FINAL_LIST $upstream_domain"
                      QUEUE+=("$upstream_domain") # Queue it to make sure its dependencies are pulled too
                    fi
                  fi
                fi
              done
            done
          done
          
          # Rearrange space tokens to clean comma-separated lists for Maven routing
          FINAL_LIST=$(echo $FINAL_LIST | xargs | tr ' ' ',')
        fi

        echo ""
        echo "=================================================="
        echo "📊 PART 2: DYNAMIC PRODUCT DEPENDENCY GRAPH REPORT"
        echo "=================================================="
        echo "Calculated Rebuild Target List: $FINAL_LIST"
        echo "--------------------------------------------------"
        echo ""
        
        # Display the fully resolved dynamic build sequence order computed by the compiler
        mvn validate -pl "$FINAL_LIST"
        
        echo ""
        echo "=================================================="
        echo "📋 FINAL EXECUTION PARAMETERS"
        echo "=================================================="
        echo " Target Modules Selected (-pl): $FINAL_LIST"
        echo "=================================================="
        echo ""
        
        echo "🔨 Launching Root Multi-Module Maven Reactor Process..."
        mvn clean package -pl "$FINAL_LIST" -DskipTests
        
        echo ""
        echo "=================================================="
        echo "🎉 PIPELINE COMPLETE - ALL STEPS SUCCESSFUL"
        echo "=================================================="
