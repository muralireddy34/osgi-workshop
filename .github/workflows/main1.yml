name: OSGi Workshop - Build Pipeline Assignment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose Build Scenario'
        required: true
        default: 'changed'
        type: choice
        options:
          - all
          - changed

jobs:
  build-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Check out the repository code with full history for file tracking
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 2: Set up Java and Maven caching environment
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Step 3: Track and filter changed modules looking at the repo root
    - name: Detect Changed Modules
      id: changed-files
      if: ${{ github.event.inputs.scenario != 'all' }}
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **

    # Step 4: Dynamically calculate plugin dependencies using deeper Maven target resolution
    - name: Run Build Pipeline & Analyze Dependencies
      env:
        SCENARIO: ${{ github.event.inputs.scenario || 'changed' }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        echo "========================================="
        echo "🚀 INITIALIZING DYNAMIC OSGi BUILD PIPELINE"
        echo "========================================="
        
        # 1. Dynamically locate every sub-project bundle pom.xml across the entire workspace
        # This formats the list as 'catalog/plugins/com.northwind.oms.core,orders/plugins/com.northwind.oms.gateway' etc.
        ALL_TARGET_POMS=$(find . -mindepth 3 -name "pom.xml" | sed 's|^\./||' | sed 's|/pom.xml||' | sort | xargs | tr ' ' ',')
        
        DIRECTLY_CHANGED=""
        MAVEN_TARGETS=""
        BUILD_FLAGS=""

        if [ "$SCENARIO" = "all" ]; then
          echo "Scenario Selected: 1️⃣ Build All Products"
          MAVEN_TARGETS="$ALL_TARGET_POMS"
        else
          echo "Scenario Selected: 2️⃣ Build Only Changed Products/Modules"
          echo "Analyzing file modifications..."
          
          # 2. Match changed files to their specific inner plugin bundle folders
          for file in $CHANGED_FILES; do
            # Extract paths up to the specific plugin or feature directory level
            if [[ "$file" =~ ^([^/]+/plugins/[^/]+|[^/]+/features/[^/]+) ]]; then
              TARGET_DIR="${BASH_REMATCH[1]}"
              
              # Confirm the path contains a valid Maven descriptor and avoid duplicate entries
              if [ -f "$TARGET_DIR/pom.xml" ] && [[ ! "$DIRECTLY_CHANGED" =~ (^|,)"$TARGET_DIR"(,|$) ]]; then
                if [ -z "$DIRECTLY_CHANGED" ]; then
                  DIRECTLY_CHANGED="$TARGET_DIR"
                else
                  DIRECTLY_CHANGED="$DIRECTLY_CHANGED,$TARGET_DIR"
                fi
              fi
            fi
          done
          
          echo "🔎 Specifically modified plugin paths: [ $DIRECTLY_CHANGED ]"
          
          if [ -z "$DIRECTLY_CHANGED" ]; then
             echo "✅ No source plugin directories modified. Pipeline clean. Exiting safely."
             exit 0
          fi
          
          MAVEN_TARGETS="$DIRECTLY_CHANGED"
          # -amd tells Maven to dynamically check the manifest.mf of all workspace modules 
          # to find everything that depends on these specific modified plugins
          BUILD_FLAGS="-amd"
        fi

        echo ""
        echo "=================================================="
        echo "📊 PART 2: DYNAMIC PRODUCT DEPENDENCY GRAPH REPORT"
        echo "=================================================="
        echo "Extracting structural topological graph metadata from Maven..."
        echo "--------------------------------------------------"
        
        # Run a quick validation to output the dynamic dependency order directly into the logs
        mvn validation:validate -pl "$MAVEN_TARGETS" $BUILD_FLAGS | grep -E "Building|Reactor Build Order:" -A 15 || true
        
        echo ""
        echo "=================================================="
        echo "📋 EXECUTION MATRIX PARAMETERS"
        echo "=================================================="
        echo " Target Plugin Selection (-pl): $MAVEN_TARGETS"
        echo " Dependent Graph Multipliers: $BUILD_FLAGS"
        echo "=================================================="
        echo ""

        echo "🔨 Launching Root Multi-Module Maven Reactor Process..."
        # Compile the dynamically computed graph chain sequentially from the workspace root
        mvn clean package -pl "$MAVEN_PROJECTS" -pl "$MAVEN_TARGETS" $BUILD_FLAGS -DskipTests
        
        echo ""
        echo "=================================================="
        echo "🎉 PIPELINE COMPLETE - ALL STEPS SUCCESSFUL"
        echo "=================================================="
