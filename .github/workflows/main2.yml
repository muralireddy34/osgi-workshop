name: OSGi Workshop - Smart Build Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose Build Scenario'
        required: true
        default: 'changed'
        type: choice
        options:
          - all
          - changed

jobs:
  build-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Detect Changed Files (only for changed scenario)
      id: changed-files
      if: ${{ github.event.inputs.scenario != 'all' }}
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **

    - name: Run Smart Build Pipeline (bash-only)
      env:
        SCENARIO: ${{ github.event.inputs.scenario || 'changed' }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        set -euo pipefail
        echo "========================================="
        echo "🚀 INITIALIZING OSGi SMART BUILD PIPELINE"
        echo "========================================="
        echo "Scenario: ${SCENARIO}"

        # Discover immediate top-level modules: folders that contain a pom.xml at depth 2 (./<module>/pom.xml)
        ALL_MODULES=$(find . -mindepth 2 -maxdepth 2 -name pom.xml -printf '%h\n' 2>/dev/null | sed -E 's|^\./||' | cut -d'/' -f1 | sort -u | xargs || true)
        if [ -z "${ALL_MODULES}" ]; then
          echo "No top-level modules discovered (no pom.xml found under top-level dirs). Exiting."
          exit 1
        fi
        read -r -a MODULE_ORDER <<< "${ALL_MODULES}"
        echo "Discovered modules: ${MODULE_ORDER[*]}"

        # Helper: join CSV
        join_csv() { local IFS=,; echo "$*"; }

        # 1) Determine directly changed top-level modules
        DIRECTLY_CHANGED=()
        if [ "${SCENARIO}" = "all" ]; then
          DIRECTLY_CHANGED=("${MODULE_ORDER[@]}")
          echo "Full-build selected -> initial set = all modules"
        else
          echo "Changed-files (raw): ${CHANGED_FILES:-<none>}"
          for f in ${CHANGED_FILES:-}; do
            if [[ "$f" =~ ^([^/]+)/ ]]; then
              mod="${BASH_REMATCH[1]}"
              # Only keep modules that were discovered
              for m in "${MODULE_ORDER[@]}"; do
                if [ "$m" = "$mod" ] && [[ ! " ${DIRECTLY_CHANGED[*]} " =~ " $mod " ]]; then
                  DIRECTLY_CHANGED+=("$mod")
                fi
              done
            fi
          done

          if [ ${#DIRECTLY_CHANGED[@]} -eq 0 ]; then
            echo "✅ No top-level modules changed. Nothing to build. Exiting."
            exit 0
          fi
          echo "🔎 Top-level modules with explicit modifications: ${DIRECTLY_CHANGED[*]}"
        fi

        # 2) Expand dependency closure (downstream + upstream) via MANIFEST.MF and pom.xml heuristics
        FINAL_SET=("${DIRECTLY_CHANGED[@]}")
        QUEUE=("${DIRECTLY_CHANGED[@]}")
        VISITED=()

        while [ ${#QUEUE[@]} -gt 0 ]; do
          CURRENT=${QUEUE[0]}
          QUEUE=("${QUEUE[@]:1}")

          if [[ " ${VISITED[*]} " =~ " $CURRENT " ]]; then
            continue
          fi
          VISITED+=("$CURRENT")

          # Derive a likely Bundle-SymbolicName for the current module, if manifests exist
          SYMBOLIC_NAME=""
          while IFS= read -r mf; do
            [ -z "$mf" ] && continue
            val=$(grep -i "Bundle-SymbolicName:" "$mf" 2>/dev/null | head -n1 | sed -E 's/Bundle-SymbolicName:[[:space:]]*//I' | cut -d';' -f1 | xargs || true)
            if [ -n "$val" ]; then
              SYMBOLIC_NAME="$val"
              break
            fi
          done < <(find "$CURRENT" -maxdepth 3 -type f -path "*/META-INF/MANIFEST.MF" 2>/dev/null || true)

          if [ -z "$SYMBOLIC_NAME" ]; then
            # fallback heuristic
            SYMBOLIC_NAME="com.northwind.oms.$CURRENT"
          fi

          # A) Downstream: find modules that reference CURRENT (by folder name, or by symbolic name)
          for candidate in "${MODULE_ORDER[@]}"; do
            [ "$candidate" = "$CURRENT" ] && continue
            ref_found=false
            # check candidate's pom.xml for references
            if [ -f "$candidate/pom.xml" ]; then
              if grep -q -R -- "$CURRENT" "$candidate/pom.xml" 2>/dev/null || grep -q -R -- "$SYMBOLIC_NAME" "$candidate/pom.xml" 2>/dev/null; then
                ref_found=true
              fi
            fi
            # check candidate manifests (if any)
            if [ "$ref_found" = false ]; then
              if grep -q -R -- "$SYMBOLIC_NAME" "$candidate" 2>/dev/null || grep -q -R -- "$CURRENT" "$candidate" 2>/dev/null; then
                ref_found=true
              fi
            fi

            if [ "$ref_found" = true ]; then
              if [[ ! " ${FINAL_SET[*]} " =~ " $candidate " ]]; then
                FINAL_SET+=("$candidate")
                QUEUE+=("$candidate")
              fi
            fi
          done

          # B) Upstream: find modules referenced by CURRENT (who CURRENT depends on)
          if [ -f "$CURRENT/pom.xml" ]; then
            for upstream in "${MODULE_ORDER[@]}"; do
              [ "$upstream" = "$CURRENT" ] && continue
              if grep -q -R -- "$upstream" "$CURRENT/pom.xml" 2>/dev/null || grep -q -R -- "com.northwind.oms.$upstream" "$CURRENT/pom.xml" 2>/dev/null; then
                if [[ ! " ${FINAL_SET[*]} " =~ " $upstream " ]]; then
                  FINAL_SET+=("$upstream")
                  QUEUE+=("$upstream")
                fi
              fi
            done
          fi
        done

        # 3) Order FINAL_SET according to MODULE_ORDER to produce a safe build sequence
        ORDERED_FINAL=()
        for m in "${MODULE_ORDER[@]}"; do
          if [[ " ${FINAL_SET[*]} " =~ " $m " ]]; then
            ORDERED_FINAL+=("$m")
          fi
        done

        MAVEN_PL=""
        if [ ${#ORDERED_FINAL[@]} -gt 0 ]; then
          MAVEN_PL=$(join_csv "${ORDERED_FINAL[@]}")
        fi

        # 4) Print dependency graph (ASCII) and resolved paths
        echo ""
        echo "=================================================="
        echo "📊 PRODUCT DEPENDENCY GRAPH (ASCII) & RESOLVED PATHS"
        echo "=================================================="
        echo "Legend: * = selected for rebuild"
        echo ""

        # small helper to mark selected nodes
        fmt_node() {
          local name=$1
          if [[ " ${ORDERED_FINAL[*]} " =~ " ${name} " ]]; then
            printf "%s*" "$name"
          else
            printf "%s" "$name"
          fi
        }

        # Generic topology based on common relationships in this repo (printed for clarity)
        echo "$(fmt_node thirdparty) -> [$(fmt_node catalog), $(fmt_node customer), $(fmt_node notification), $(fmt_node security), $(fmt_node shipping), $(fmt_node payment), $(fmt_node orders), $(fmt_node reporting)]"
        echo "$(fmt_node catalog) -> [$(fmt_node orders), $(fmt_node reporting)]"
        echo "$(fmt_node customer) -> [$(fmt_node orders)]"
        echo "$(fmt_node notification) -> [$(fmt_node orders)]"
        echo "$(fmt_node security) -> [$(fmt_node orders)]"
        echo "$(fmt_node shipping) -> [$(fmt_node orders)]"
        echo "$(fmt_node payment) -> [$(fmt_node orders)]"
        echo "$(fmt_node orders) -> [$(fmt_node reporting)]"

        if [ "${SCENARIO}" != "all" ]; then
          echo ""
          echo "🔗 RESOLVED DEPENDENCY PATHS FOR CHANGED MODULES:"
          for ch in "${DIRECTLY_CHANGED[@]}"; do
            case "$ch" in
              thirdparty) echo "  - thirdparty -> (impacts many modules)" ;;
              catalog) echo "  - catalog -> orders -> reporting" ;;
              customer) echo "  - customer -> orders -> reporting" ;;
              notification) echo "  - notification -> orders -> reporting" ;;
              security) echo "  - security -> orders -> reporting" ;;
              shipping) echo "  - shipping -> orders -> reporting" ;;
              payment) echo "  - payment -> orders -> reporting" ;;
              orders) echo "  - orders -> reporting" ;;
              reporting) echo "  - reporting (leaf)" ;;
              *) echo "  - ${ch} -> (resolved dynamically)" ;;
            esac
          done
        fi

        echo ""
        echo "=================================================="
        echo "📋 FINAL CALCULATED SMART BUILD SEQUENCE"
        echo "=================================================="
        echo "Selected Targets (in build order): ${ORDERED_FINAL[*]}"
        echo "Maven -pl parameter value: ${MAVEN_PL}"
        echo "=================================================="
        echo ""

        if [ -z "${MAVEN_PL}" ]; then
          echo "No modules selected for building. Exiting."
          exit 0
        fi

        echo "🔨 Launching Maven Reactor:"
        echo "mvn -B clean package -pl \"${MAVEN_PL}\" -am -DskipTests"
        mvn -B clean package -pl "${MAVEN_PL}" -am -DskipTests

        echo ""
        echo "=================================================="
        echo "🎉 PIPELINE COMPLETE - ALL STEPS SUCCESSFUL"
        echo "=================================================="
