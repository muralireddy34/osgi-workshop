name: OSGi Workshop - Build Pipeline Assignment

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose Build Scenario'
        required: true
        default: 'changed'
        type: choice
        options:
          - all
          - changed

jobs:
  build-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Check out the repository code with full history for file tracking
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 2: Set up Java and Maven caching environment
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Step 3: Track and filter changed modules looking at the repo root
    - name: Detect Changed Modules
      id: changed-files
      if: ${{ github.event.inputs.scenario != 'all' }}
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **

    # Step 4: Resolve dependencies and execute build targets using Maven Reactor
    - name: Run Build Pipeline & Analyze Dependencies
      env:
        SCENARIO: ${{ github.event.inputs.scenario || 'changed' }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        echo "========================================="
        echo "🚀 INITIALIZING OSGi SMART BUILD PIPELINE"
        echo "========================================="
        
        FULL_ORDER=("thirdparty" "catalog" "customer" "notification" "security" "shipping" "payment" "orders" "reporting")
        
        REBUILD_thirdparty=false
        REBUILD_catalog=false
        REBUILD_customer=false
        REBUILD_notification=false
        REBUILD_security=false
        REBUILD_shipping=false
        REBUILD_payment=false
        REBUILD_orders=false
        REBUILD_reporting=false
        
        DIRECTLY_CHANGED=""

        if [ "$SCENARIO" = "all" ]; then
          echo "Scenario Selected: 1️⃣ Build All Products"
          for mod in "${FULL_ORDER[@]}"; do
            eval "REBUILD_$mod=true"
          done
        else
          echo "Scenario Selected: 2️⃣ Build Only Changed Products/Modules"
          echo "Analyzing file modifications..."
          
          for file in $CHANGED_FILES; do
            if [[ "$file" =~ ^([^/]+)/ ]]; then
              DOMAIN="${BASH_REMATCH[1]}"
              case "$DOMAIN" in
                thirdparty)   REBUILD_thirdparty=true ;;
                catalog)      REBUILD_catalog=true ;;
                customer)     REBUILD_customer=true ;;
                notification) REBUILD_notification=true ;;
                security)     REBUILD_security=true ;;
                shipping)     REBUILD_shipping=true ;;
                payment)      REBUILD_payment=true ;;
                orders)       REBUILD_orders=true ;;
                reporting)    REBUILD_reporting=true ;;
              esac
            fi
          done
          
          [ "$REBUILD_thirdparty" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED thirdparty"
          [ "$REBUILD_catalog" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED catalog"
          [ "$REBUILD_customer" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED customer"
          [ "$REBUILD_notification" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED notification"
          [ "$REBUILD_security" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED security"
          [ "$REBUILD_shipping" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED shipping"
          [ "$REBUILD_payment" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED payment"
          [ "$REBUILD_orders" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED orders"
          [ "$REBUILD_reporting" = true ] && DIRECTLY_CHANGED="$DIRECTLY_CHANGED reporting"
          
          echo "🔎 Modules with explicit local modifications: [$DIRECTLY_CHANGED ]"
          
          if [ -z "$DIRECTLY_CHANGED" ]; then
             echo "✅ No source directories modified. Pipeline clean. Exiting safely."
             exit 0
          fi

          if [ "$REBUILD_thirdparty" = true ]; then
            REBUILD_catalog=true; REBUILD_customer=true; REBUILD_notification=true;
            REBUILD_security=true; REBUILD_shipping=true; REBUILD_payment=true;
            REBUILD_orders=true; REBUILD_reporting=true;
          fi
          
          if [ "$REBUILD_catalog" = true ]; then
            REBUILD_orders=true; REBUILD_reporting=true;
          fi
          
          if [ "$REBUILD_customer" = true ] || [ "$REBUILD_notification" = true ] || \
             [ "$REBUILD_security" = true ] || [ "$REBUILD_shipping" = true ] || \
             [ "$REBUILD_payment" = true ]; then
            REBUILD_orders=true
          fi
          
          if [ "$REBUILD_orders" = true ]; then
            REBUILD_reporting=true
          fi
        fi

        echo ""
        echo "=================================================="
        echo "📊 PART 2: PRODUCT DEPENDENCY GRAPH DIAGRAM"
        echo "=================================================="
        
        fmt_node() {
          local name=$1; local var_name="REBUILD_$name"
          if [ "${!var_name}" = true ]; then echo -e "\033[31m$name*\033[0m"; else echo "$name"; fi
        }

        echo "   $(fmt_node thirdparty) ──► [ $(fmt_node catalog), $(fmt_node orders), $(fmt_node payment), $(fmt_node shipping), $(fmt_node notification), $(fmt_node customer), $(fmt_node security), $(fmt_node reporting) ]"
        echo "   $(fmt_node catalog) ──► [ $(fmt_node orders), $(fmt_node reporting) ]"
        echo "   $(fmt_node customer) ──► [ $(fmt_node orders) ]"
        echo "   $(fmt_node notification) ──► [ $(fmt_node orders) ]"
        echo "   $(fmt_node security) ──► [ $(fmt_node orders) ]"
        echo "   $(fmt_node shipping) ──► [ $(fmt_node orders) ]"
        echo "   $(fmt_node payment) ──► [ $(fmt_node orders) ]"
        echo "   $(fmt_node orders) ──► [ $(fmt_node reporting) ]"

        if [ "$SCENARIO" != "all" ]; then
          echo ""
          echo "🔗 RESOLVED DOWNSTREAM CHAINS FOR CHANGED CODE:"
          [[ "$DIRECTLY_CHANGED" =~ "thirdparty" ]] && echo "   Path: thirdparty ──► Global Impact (All modules triggered)"
          [[ "$DIRECTLY_CHANGED" =~ "catalog" ]]    && echo "   Path: catalog ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "customer" ]]   && echo "   Path: customer ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "notification" ]] && echo "   Path: notification ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "security" ]]   && echo "   Path: security ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "shipping" ]]   && echo "   Path: shipping ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "payment" ]]    && echo "   Path: payment ──► orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "orders" ]]     && echo "   Path: orders ──► reporting"
          [[ "$DIRECTLY_CHANGED" =~ "reporting" ]]  && echo "   Path: reporting (Leaf target node)"
        fi

        MAVEN_PROJECTS=""
        for mod in "${FULL_ORDER[@]}"; do
          var_name="REBUILD_$mod"
          if [ "${!var_name}" = true ]; then
            if [ -z "$MAVEN_PROJECTS" ]; then
              MAVEN_PROJECTS="$mod"
            else
              MAVEN_PROJECTS="$MAVEN_PROJECTS,$mod"
            fi
          fi
        done

        echo ""
        echo "=================================================="
        echo "📋 FINAL CALCULATED SMART BUILD SEQUENCE"
        echo "=================================================="
        echo " Targets: $MAVEN_PROJECTS"
        echo "=================================================="
        echo ""

        echo "🔨 Launching Root Multi-Module Maven Reactor Process..."
        mvn clean package -pl "$MAVEN_PROJECTS" -DskipTests
        
        echo ""
        echo "=================================================="
        echo "🎉 PIPELINE COMPLETE - ALL STEPS SUCCESSFUL"
        echo "=================================================="
