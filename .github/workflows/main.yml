name: Northwind OSGi Smart Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select build mode"
        required: true
        type: choice
        default: changed
        options:
          - changed
          - all

jobs:
  build:
    name: Build Northwind OSGi
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # --------------------------------------------------
      # 3. Display versions
      # --------------------------------------------------
      - name: Display Java and Maven versions
        run: |
          java -version
          mvn -version

      # --------------------------------------------------
      # 4. Detect changed modules
      # --------------------------------------------------
      - name: Detect changed modules
        id: changes
        if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'changed'
        run: |
          echo "========================================"
          echo "Detecting changed files"
          echo "========================================"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              > changed-files.txt

          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              > changed-files.txt

          else
            git diff --name-only HEAD^ HEAD > changed-files.txt
          fi

          echo ""
          echo "Changed files:"
          cat changed-files.txt

          echo ""
          echo "========================================"
          echo "Changed OSGi module paths"
          echo "========================================"

          grep -E \
            '^(catalog|customer|security|payment|shipping|notification|orders|reporting|thirdparty)/' \
            changed-files.txt \
            | cut -d/ -f1-3 \
            | sort -u \
            || true

      # --------------------------------------------------
      # 5. Full build
      # --------------------------------------------------
      - name: Build all OSGi modules
        if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'all'
        run: |
          mvn -B clean verify

      # --------------------------------------------------
      # 6. Automatic full build for now
      # --------------------------------------------------
      - name: Build OSGi project
        if: github.event_name != 'workflow_dispatch'
        run: |
          mvn -B clean verify
